package:
  manifest_mode: hybrid
  auto_sync_manifest_on_startup: true

runtime:
  startup_timeout_sec: 30

logging:
  log_dir: logs
  # One non-rotating text file per application session. Managed sessions and
  # screenshots expire after 72 hours; cleanup runs only at owner startup.

observability:
  runs:
    # Durable SQLite history has its own periodic, whole-family retention.
    retention_hours: 72
    cleanup_interval_seconds: 300
    cleanup_batch_size: 500
    cleanup_transaction_ms: 100

services:
  ocr:
    preload_on_start: true
    warmup: true
    required: true

ocr:
  recognition:
    width_mode: legacy
    min_width: 160
    batch_mode: adaptive
    batch_size: 8
    split_min_saving: 0.25
  profiling:
    enabled: false
  models_root: models/ocr
  default_model: ppocrv6_small
  execution_provider: auto
  session:
    intra_op_num_threads: 8
    allow_spinning: false
