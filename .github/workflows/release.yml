name: Package and release Aura Resonance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      scope:
        description: Build scope
        type: choice
        options: [auto, full, ci]
        default: auto
      publish_release:
        description: Publish artifacts to a GitHub Release
        type: boolean
        default: false
      release_tag:
        description: Release tag for a manually published run
        type: string
        required: false
      run_gpu_smoke:
        description: Run CUDA OCR smoke on a self-hosted Windows GPU runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  scope:
    runs-on: windows-2022
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      release_label: ${{ steps.label.outputs.release_label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release policy
        id: policy
        shell: pwsh
        run: |
          $contract = Get-Content -Raw packaging\release-contract.json | ConvertFrom-Json
          "python_version=$($contract.python.major_minor)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.policy.outputs.python_version }}

      - name: Resolve release label
        id: label
        shell: pwsh
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $label = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:MANUAL_TAG) {
            $label = $env:MANUAL_TAG
          } else {
            $label = $env:GITHUB_SHA.Substring(0, 7)
          }
          $label = $label -replace '[^A-Za-z0-9._-]', '-'
          "release_label=$label" >> $env:GITHUB_OUTPUT

      - name: Detect release scope
        id: classify
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          MANUAL_SCOPE: ${{ inputs.scope }}
        run: |
          $base = ""
          $forced = "auto"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $forced = "full"
          } elseif ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $base = $env:PR_BASE_SHA
          } elseif ($env:GITHUB_EVENT_NAME -eq "push") {
            $base = $env:PUSH_BASE_SHA
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            if ($env:MANUAL_SCOPE -eq "ci") { $forced = "none" }
            elseif ($env:MANUAL_SCOPE) { $forced = $env:MANUAL_SCOPE }
            $base = (git rev-parse HEAD^ 2>$null)
          }
          $args = @(
            "scripts\release\detect_release_scope.py",
            "--head", $env:GITHUB_SHA,
            "--force", $forced,
            "--github-output", $env:GITHUB_OUTPUT
          )
          if ($base) { $args += @("--base", $base) }
          python @args

  ci:
    runs-on: windows-2022
    needs: scope
    steps:
      - uses: actions/checkout@v4

      - name: Read release policy
        id: policy
        shell: pwsh
        run: |
          $contract = Get-Content -Raw packaging\release-contract.json | ConvertFrom-Json
          "python_version=$($contract.python.major_minor)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.policy.outputs.python_version }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install CI dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements\ci.txt

      - name: Validate release contract and locks
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from scripts.release.release_contract import load_contract, parse_hashed_lock; c=load_contract(); [parse_hashed_lock(Path(c['profiles'][p]['requirements_lock'])) for p in ('cpu','gpu','overlay')]"

      - name: Validate Plan manifests
        shell: pwsh
        run: |
          Get-ChildItem plans -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName "manifest.yaml")
          } | ForEach-Object {
            python -m packages.aura_core.cli.package_cli check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Plan manifest is out of date: $($_.Name)" }
            python -m packages.aura_core.cli.package_cli validate $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Plan manifest is invalid: $($_.Name)" }
          }

      - name: Run test suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  build-full:
    needs: [scope, ci]
    if: ${{ needs.scope.outputs.scope == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        profile: [cpu, gpu, overlay]
    uses: ./.github/workflows/_build-windows.yml
    with:
      profile: ${{ matrix.profile }}
      release_label: ${{ needs.scope.outputs.release_label }}

  verify-set:
    runs-on: windows-2022
    needs: [scope, ci, build-full]
    if: ${{ needs.scope.outputs.scope == 'full' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read release policy
        id: policy
        shell: pwsh
        run: |
          $contract = Get-Content -Raw packaging\release-contract.json | ConvertFrom-Json
          "python_version=$($contract.python.major_minor)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.policy.outputs.python_version }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-full-*
          path: .runtime-artifacts
          merge-multiple: true

      - name: Validate CPU, GPU, and overlay as one release set
        shell: pwsh
        env:
          RELEASE_LABEL: ${{ needs.scope.outputs.release_label }}
        run: |
          python -m scripts.release.validate_release_set `
            --cpu ".runtime-artifacts\AuraResonance-$env:RELEASE_LABEL-win-x64-cpu.zip" `
            --gpu ".runtime-artifacts\AuraResonance-$env:RELEASE_LABEL-win-x64-gpu.zip" `
            --overlay ".runtime-artifacts\AuraResonance-$env:RELEASE_LABEL-nvidia-cu13-overlay.zip" `
            --label $env:RELEASE_LABEL `
            --contract packaging\release-contract.json `
            --work-root .runtime-validate-set `
            --checksums .runtime-artifacts\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: .runtime-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  gpu-smoke:
    runs-on: [self-hosted, windows, gpu]
    needs: [scope, verify-set]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gpu_smoke && needs.scope.outputs.scope == 'full' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-full-*
          path: .runtime-artifacts
          merge-multiple: true

      - name: Verify CUDA OCR provider
        shell: pwsh
        env:
          RELEASE_LABEL: ${{ needs.scope.outputs.release_label }}
        run: |
          $work = ".runtime-gpu-smoke"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $gpuZip = ".runtime-artifacts\AuraResonance-$env:RELEASE_LABEL-win-x64-gpu.zip"
          $overlayZip = ".runtime-artifacts\AuraResonance-$env:RELEASE_LABEL-nvidia-cu13-overlay.zip"
          Expand-Archive -LiteralPath $gpuZip -DestinationPath $work -Force
          Expand-Archive -LiteralPath $overlayZip -DestinationPath $work -Force
          $release = Join-Path $work "AuraResonance-$env:RELEASE_LABEL-win-x64-gpu"
          pwsh -NoProfile -File (Join-Path $release "run.ps1") doctor --ocr --ocr-provider cuda
          if ($LASTEXITCODE -ne 0) { throw "CUDA OCR smoke failed." }

  publish:
    runs-on: windows-2022
    permissions:
      contents: write
    needs: [scope, ci, build-full, verify-set]
    if: >-
      ${{
        always() &&
        needs.ci.result == 'success' &&
        needs.build-full.result == 'success' &&
        needs.verify-set.result == 'success' &&
        (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
      }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: .runtime-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { $env:MANUAL_TAG }
          if (-not $tag) { throw "A release tag is required for publishing." }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $tag `
              --notes "Automated Aura Resonance package build for $tag."
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag." }
          }
          $assets = @(Get-ChildItem .runtime-artifacts -File | Where-Object {
            $_.Extension -eq ".zip" -or $_.Name -eq "SHA256SUMS.txt"
          })
          if ($assets.Count -ne 4) { throw "Expected three release archives and SHA256SUMS.txt; found $($assets.Count)." }
          foreach ($asset in $assets) {
            gh release upload $tag $asset.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($asset.Name)." }
          }
