name: Package and release Aura Resonance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      scope:
        description: Build scope
        type: choice
        options: [auto, full, ci]
        default: auto
      publish_release:
        description: Publish artifacts to a GitHub Release
        type: boolean
        default: false
      release_tag:
        description: Release tag for a manually published run
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  scope:
    runs-on: windows-2022
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      release_label: ${{ steps.label.outputs.release_label }}
      publish_allowed: ${{ steps.release_source.outputs.publish_allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release source is on main
        id: release_source
        shell: pwsh
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch origin/main for release source validation." }

          $sourceCommit = (git rev-parse "$env:GITHUB_SHA^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to resolve $env:GITHUB_SHA to a commit."
          }
          $mergeBase = (git merge-base $sourceCommit refs/remotes/origin/main).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to compare $sourceCommit with origin/main."
          }
          if ($mergeBase -eq $sourceCommit) {
            "publish_allowed=true" >> $env:GITHUB_OUTPUT
          } else {
            "publish_allowed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Read release policy
        id: policy
        shell: pwsh
        run: |
          $contract = Get-Content -Raw packaging\release-contract.json | ConvertFrom-Json
          "python_version=$($contract.python.major_minor)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.policy.outputs.python_version }}

      - name: Resolve release label
        id: label
        shell: pwsh
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $label = $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:MANUAL_TAG) {
            $label = $env:MANUAL_TAG
          } else {
            $label = $env:GITHUB_SHA.Substring(0, 7)
          }
          $label = $label -replace '[^A-Za-z0-9._-]', '-'
          "release_label=$label" >> $env:GITHUB_OUTPUT

      - name: Detect release scope
        id: classify
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          MANUAL_SCOPE: ${{ inputs.scope }}
        run: |
          $base = ""
          $forced = "auto"
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $forced = "full"
          } elseif ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $base = $env:PR_BASE_SHA
          } elseif ($env:GITHUB_EVENT_NAME -eq "push") {
            $base = $env:PUSH_BASE_SHA
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            if ($env:MANUAL_SCOPE -eq "ci") { $forced = "none" }
            elseif ($env:MANUAL_SCOPE) { $forced = $env:MANUAL_SCOPE }
            $base = (git rev-parse HEAD^ 2>$null)
          }
          $args = @(
            "scripts\release\detect_release_scope.py",
            "--head", $env:GITHUB_SHA,
            "--force", $forced,
            "--github-output", $env:GITHUB_OUTPUT
          )
          if ($base) { $args += @("--base", $base) }
          python @args

  ci:
    runs-on: windows-2022
    needs: scope
    steps:
      - uses: actions/checkout@v4

      - name: Read release policy
        id: policy
        shell: pwsh
        run: |
          $contract = Get-Content -Raw packaging\release-contract.json | ConvertFrom-Json
          "python_version=$($contract.python.major_minor)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.policy.outputs.python_version }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install CI dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements\ci.txt

      - name: Validate release contract and locks
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from scripts.release.release_contract import load_contract, parse_hashed_lock; c=load_contract(); [parse_hashed_lock(Path(c['profiles'][p]['requirements_lock'])) for p in ('cpu','gpu','overlay')]"

      - name: Validate Plan manifests
        shell: pwsh
        run: |
          Get-ChildItem plans -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName "manifest.yaml")
          } | ForEach-Object {
            python -m packages.aura_core.cli.package_cli check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Plan manifest is out of date: $($_.Name)" }
            python -m packages.aura_core.cli.package_cli validate $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Plan manifest is invalid: $($_.Name)" }
          }

      - name: Run test suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  build-cpu:
    needs: [scope, ci]
    if: ${{ needs.scope.outputs.scope == 'full' }}
    uses: ./.github/workflows/_build-windows.yml
    with:
      profile: cpu
      release_label: ${{ needs.scope.outputs.release_label }}

  verify-cpu:
    runs-on: windows-2022
    needs: [scope, ci, build-cpu]
    if: ${{ needs.scope.outputs.scope == 'full' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-full-cpu
          path: .runtime-artifacts

      - name: Verify CPU release artifact and write checksum
        shell: pwsh
        env:
          RELEASE_LABEL: ${{ needs.scope.outputs.release_label }}
        run: |
          $expected = "AuraResonance-$env:RELEASE_LABEL-win-x64-cpu.zip"
          $archives = @(Get-ChildItem .runtime-artifacts -File -Filter "*.zip")
          if ($archives.Count -ne 1 -or $archives[0].Name -ne $expected) {
            throw "Expected only CPU release archive '$expected'."
          }
          $hash = (Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ".runtime-artifacts\SHA256SUMS.txt" `
            -Value "$hash  $expected" `
            -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: .runtime-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    runs-on: windows-2022
    permissions:
      contents: write
    needs: [scope, ci, build-cpu, verify-cpu]
    if: >-
      ${{
        always() &&
        needs.ci.result == 'success' &&
        needs.build-cpu.result == 'success' &&
        needs.verify-cpu.result == 'success' &&
        needs.scope.outputs.publish_allowed == 'true' &&
        (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
      }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: .runtime-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          RELEASE_LABEL: ${{ needs.scope.outputs.release_label }}
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { $env:MANUAL_TAG }
          if (-not $tag) { throw "A release tag is required for publishing." }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title $tag `
              --notes "Automated Aura Resonance package build for $tag."
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag." }
          }
          $expectedAssets = @(
            "AuraResonance-$env:RELEASE_LABEL-win-x64-cpu.zip",
            "SHA256SUMS.txt"
          )
          $assets = @(Get-ChildItem .runtime-artifacts -File | Where-Object {
            $_.Extension -eq ".zip" -or $_.Name -eq "SHA256SUMS.txt"
          })
          $unexpected = @($assets | Where-Object { $_.Name -notin $expectedAssets })
          if ($assets.Count -ne 2 -or $unexpected.Count -ne 0) {
            throw "Expected CPU release archive and SHA256SUMS.txt; found $($assets.Count) release assets."
          }
          foreach ($asset in $assets) {
            gh release upload $tag $asset.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($asset.Name)." }
          }
