name: Package and release Aura Resonance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      scope:
        description: Build scope
        type: choice
        options: [auto, full, ci]
        default: auto
      publish_release:
        description: Publish artifacts to a GitHub Release
        type: boolean
        default: false
      release_tag:
        description: Release tag in vX.X.X or vX.X.X-E-N format
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  scope:
    runs-on: windows-2022
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      release_label: ${{ steps.label.outputs.release_label }}
      is_experimental: ${{ steps.label.outputs.is_experimental }}
      source_commit: ${{ steps.release_source.outputs.source_commit }}
      publish_allowed: ${{ steps.release_source.outputs.publish_allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release source is on main
        id: release_source
        shell: pwsh
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch origin/main for release source validation." }

          $sourceCommit = (git rev-parse "$env:GITHUB_SHA^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to resolve $env:GITHUB_SHA to a commit."
          }
          "source_commit=$sourceCommit" >> $env:GITHUB_OUTPUT
          $mergeBase = (git merge-base $sourceCommit refs/remotes/origin/main).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to compare $sourceCommit with origin/main."
          }
          if ($mergeBase -eq $sourceCommit) {
            "publish_allowed=true" >> $env:GITHUB_OUTPUT
          } else {
            "publish_allowed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Read release policy
        id: policy
        shell: pwsh
        run: |
          $contract = Get-Content -Raw packaging\release-contract.json | ConvertFrom-Json
          "python_version=$($contract.python.major_minor)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.policy.outputs.python_version }}

      - name: Resolve release label
        id: label
        shell: pwsh
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $label = $env:GITHUB_REF_NAME
            $releaseVersion = $label
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:MANUAL_TAG) {
            $label = $env:MANUAL_TAG
            $releaseVersion = $label
          } else {
            $label = $env:GITHUB_SHA.Substring(0, 7)
            $releaseVersion = ""
          }
          $isExperimental = $false
          if ($releaseVersion) {
            if ($releaseVersion -cmatch '^(?<base>v[0-9]+\.[0-9]+\.[0-9]+)(?:-E-(?<serial>[1-9][0-9]*))?$') {
              $baseVersion = $Matches['base']
              $isExperimental = $Matches.ContainsKey('serial')
            } else {
              throw "Release version must use vX.X.X format for formal builds or vX.X.X-E-N for experimental builds, where N is a positive integer. Received '$releaseVersion'."
            }
            $sourceVersion = (python -c "from packages.resonance_gui import __version__; print(__version__)").Trim()
            if ($LASTEXITCODE -ne 0) { throw "Failed to read the application version." }
            if ($sourceVersion -cne $baseVersion) {
              throw "Release version '$releaseVersion' does not match application version '$sourceVersion'."
            }
          }
          $label = $label -replace '[^A-Za-z0-9._-]', '-'
          "release_label=$label" >> $env:GITHUB_OUTPUT
          "is_experimental=$($isExperimental.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Detect release scope
        id: classify
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          MANUAL_SCOPE: ${{ inputs.scope }}
        run: |
          $base = ""
          $forced = "auto"
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $forced = "full"
          } elseif ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $base = $env:PR_BASE_SHA
          } elseif ($env:GITHUB_EVENT_NAME -eq "push") {
            $base = $env:PUSH_BASE_SHA
          } elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            if ($env:MANUAL_SCOPE -eq "ci") { $forced = "none" }
            elseif ($env:MANUAL_SCOPE) { $forced = $env:MANUAL_SCOPE }
            $base = (git rev-parse HEAD^ 2>$null)
          }
          $args = @(
            "scripts\release\detect_release_scope.py",
            "--head", $env:GITHUB_SHA,
            "--force", $forced,
            "--github-output", $env:GITHUB_OUTPUT
          )
          if ($base) { $args += @("--base", $base) }
          python @args

  ci:
    runs-on: windows-2022
    needs: scope
    steps:
      - uses: actions/checkout@v4

      - name: Read release policy
        id: policy
        shell: pwsh
        run: |
          $contract = Get-Content -Raw packaging\release-contract.json | ConvertFrom-Json
          "python_version=$($contract.python.major_minor)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.policy.outputs.python_version }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install CI dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements\ci.txt

      - name: Build Windows HDR capture component
        shell: pwsh
        run: ./tools/native/wgc_hdr/build.ps1

      - name: Prepare required OCR models for runtime smoke tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts\release\download_ocr_models.ps1 -PythonPath python
          if ($LASTEXITCODE -ne 0) { throw "Failed to prepare required OCR models for source runtime smoke tests." }
          $contract = Get-Content -Raw packaging\release-contract.json | ConvertFrom-Json
          python scripts\release\validate_ocr_bundle.py $contract.assets.ocr.bundle_directory
          if ($LASTEXITCODE -ne 0) { throw "Source runtime OCR model validation failed." }

      - name: Validate release contract and locks
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from scripts.release.release_contract import load_contract, parse_hashed_lock; c=load_contract(); [parse_hashed_lock(Path(c['profiles'][p]['requirements_lock'])) for p in ('cpu','gpu','overlay')]"

      - name: Validate Plan manifests
        shell: pwsh
        run: |
          Get-ChildItem plans -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName "manifest.yaml")
          } | ForEach-Object {
            python -m packages.aura_core.cli.package_cli check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Plan manifest is out of date: $($_.Name)" }
            python -m packages.aura_core.cli.package_cli validate $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Plan manifest is invalid: $($_.Name)" }
          }

      - name: Run architecture contract suite
        id: contract_suite
        shell: pwsh
        continue-on-error: true
        run: python -m pytest tests/contracts -q

      - name: Run behavior unit suite
        id: behavior_suite
        shell: pwsh
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/unit -q --durations=15

      - name: Run source runtime smoke suite
        id: source_smoke_suite
        shell: pwsh
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/smoke -q

      - name: Enforce test suite results
        if: always()
        shell: pwsh
        env:
          CONTRACT_OUTCOME: ${{ steps.contract_suite.outcome }}
          BEHAVIOR_OUTCOME: ${{ steps.behavior_suite.outcome }}
          SOURCE_SMOKE_OUTCOME: ${{ steps.source_smoke_suite.outcome }}
        run: |
          $failed = @()
          if ($env:CONTRACT_OUTCOME -ne "success") { $failed += "contracts=$env:CONTRACT_OUTCOME" }
          if ($env:BEHAVIOR_OUTCOME -ne "success") { $failed += "behavior=$env:BEHAVIOR_OUTCOME" }
          if ($env:SOURCE_SMOKE_OUTCOME -ne "success") { $failed += "source-smoke=$env:SOURCE_SMOKE_OUTCOME" }
          if ($failed.Count -gt 0) {
            throw "Test gates failed: $($failed -join ', ')"
          }

  build-cpu:
    # Build alongside CI for releases; ordinary PR/main pushes only need source CI.
    needs: [scope]
    if: >-
      ${{
        needs.scope.outputs.scope == 'full' &&
        (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
      }}
    uses: ./.github/workflows/_build-windows.yml
    with:
      profile: cpu
      release_label: ${{ needs.scope.outputs.release_label }}

  verify-cpu:
    runs-on: windows-2022
    needs: [scope, build-cpu]
    if: >-
      ${{
        needs.scope.outputs.scope == 'full' &&
        (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
      }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-full-cpu
          path: .runtime-artifacts

      - name: Verify CPU release artifact and write checksum
        shell: pwsh
        env:
          RELEASE_LABEL: ${{ needs.scope.outputs.release_label }}
        run: |
          $expected = "AuraResonance-$env:RELEASE_LABEL-win-x64-cpu.zip"
          $archives = @(Get-ChildItem .runtime-artifacts -File -Filter "*.zip")
          if ($archives.Count -ne 1 -or $archives[0].Name -ne $expected) {
            throw "Expected only CPU release archive '$expected'."
          }
          $hash = (Get-FileHash -LiteralPath $archives[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ".runtime-artifacts\SHA256SUMS.txt" `
            -Value "$hash  $expected" `
            -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: .runtime-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    runs-on: windows-2022
    permissions:
      contents: write
    needs: [scope, ci, build-cpu, verify-cpu]
    concurrency:
      group: aura-publish-${{ needs.scope.outputs.release_label }}
      cancel-in-progress: false
    if: >-
      ${{
        always() &&
        needs.ci.result == 'success' &&
        needs.build-cpu.result == 'success' &&
        needs.verify-cpu.result == 'success' &&
        needs.scope.outputs.publish_allowed == 'true' &&
        (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
      }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: .runtime-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          RELEASE_LABEL: ${{ needs.scope.outputs.release_label }}
          IS_EXPERIMENTAL: ${{ needs.scope.outputs.is_experimental }}
          SOURCE_COMMIT: ${{ needs.scope.outputs.source_commit }}
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { $env:MANUAL_TAG }
          if ($tag -cne $env:RELEASE_LABEL -or $tag -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-E-[1-9][0-9]*)?$') {
            throw "Release tag must match the packaged vX.X.X or vX.X.X-E-N label. Received '$tag'."
          }
          $isExperimental = $env:IS_EXPERIMENTAL -eq 'true'
          $prereleaseFlag = "--prerelease=$($isExperimental.ToString().ToLowerInvariant())"
          $expectedAssets = @(
            "AuraResonance-$env:RELEASE_LABEL-win-x64-cpu.zip",
            "SHA256SUMS.txt"
          )
          $assets = @(Get-ChildItem .runtime-artifacts -File | Where-Object {
            $_.Extension -eq ".zip" -or $_.Name -eq "SHA256SUMS.txt"
          })
          $unexpected = @($assets | Where-Object { $_.Name -notin $expectedAssets })
          if ($assets.Count -ne 2 -or $unexpected.Count -ne 0) {
            throw "Expected CPU release archive and SHA256SUMS.txt; found $($assets.Count) release assets."
          }

          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:SOURCE_COMMIT `
              --title $tag `
              --notes "Automated Aura Resonance package build for $tag." `
              --draft $prereleaseFlag
            if ($LASTEXITCODE -ne 0) { throw "Failed to create draft release $tag." }
            $isDraft = $true
          } else {
            $isDraft = ($existing | ConvertFrom-Json).isDraft
          }

          if ($isDraft) {
            # Keep both downloads private until the release is ready.
            foreach ($asset in $assets) {
              gh release upload $tag $asset.FullName --repo $env:GITHUB_REPOSITORY --clobber
              if ($LASTEXITCODE -ne 0) { throw "Failed to upload $($asset.Name)." }
            }
            $makeLatest = -not $isExperimental
            if ($makeLatest) {
              $latestTag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName 2>$null
              if ($LASTEXITCODE -eq 0 -and $latestTag -cmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
                $makeLatest = [version]($tag.Substring(1)) -ge [version]($latestTag.Substring(1))
              }
            }
            $latestFlag = "--latest=$($makeLatest.ToString().ToLowerInvariant())"
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $tag --draft=false $prereleaseFlag $latestFlag
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish release $tag." }
          }

          $published = gh release view $tag --repo $env:GITHUB_REPOSITORY --json name,isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw "Failed to read published release $tag." }
          $release = $published | ConvertFrom-Json
          if ($release.isDraft -or $release.isPrerelease -ne $isExperimental -or $release.name -cne $tag) {
            throw "Published release $tag has the wrong title or release channel."
          }
          $uploadedNames = @($release.assets | Where-Object { $_.size -gt 0 } | ForEach-Object { $_.name })
          $missing = @($expectedAssets | Where-Object { $_ -cnotin $uploadedNames })
          if ($missing.Count -ne 0) { throw "Published release $tag is missing $($missing -join ', ')." }

      - name: Update experimental channel index
        if: needs.scope.outputs.is_experimental == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_LABEL: ${{ needs.scope.outputs.release_label }}
          SOURCE_COMMIT: ${{ needs.scope.outputs.source_commit }}
        run: |
          $tag = $env:RELEASE_LABEL
          $branch = 'release-channels'
          $repo = "repos/$env:GITHUB_REPOSITORY"
          $branchEndpoint = "$repo/git/ref/heads/$branch"
          gh api $branchEndpoint --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api --method POST "$repo/git/refs" -f "ref=refs/heads/$branch" -f "sha=$env:SOURCE_COMMIT" --silent
            if ($LASTEXITCODE -ne 0) {
              gh api $branchEndpoint --silent
              if ($LASTEXITCODE -ne 0) { throw "Failed to initialize the update channel branch '$branch'." }
            }
          }

          $indexEndpoint = "$repo/contents/experimental.json"
          $experimentalPattern = '^v(?<base>[0-9]+\.[0-9]+\.[0-9]+)-E(?:-(?<serial>[1-9][0-9]*))?$'
          if ($tag -cmatch $experimentalPattern -and $Matches.ContainsKey('serial')) {
            $newVersion = [version]($Matches['base'])
            $newSerial = [bigint]($Matches['serial'])
          } else {
            throw "Experimental update index requires a numbered release tag. Received '$tag'."
          }
          $json = @{ tag = $tag } | ConvertTo-Json -Compress
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$json`n"))
          # Re-read both the tag and the blob SHA after a competing publication.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $writeArgs = @('-f', "branch=$branch", '-f', "content=$content", '-f', "message=Publish experimental update $tag")
            $existing = gh api --method GET $indexEndpoint -f "ref=$branch" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $indexFile = $existing | ConvertFrom-Json
              $indexJson = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($indexFile.content))
              $activeTag = ($indexJson | ConvertFrom-Json).tag
              if ($activeTag -cmatch $experimentalPattern) {
                $activeVersion = [version]($Matches['base'])
                $activeSerial = if ($Matches.ContainsKey('serial')) { [bigint]($Matches['serial']) } else { [bigint]0 }
                if ($activeVersion -gt $newVersion -or ($activeVersion -eq $newVersion -and $activeSerial -ge $newSerial)) {
                  Write-Host "Experimental update index already points to $activeTag."
                  exit 0
                }
              }
              $writeArgs += @('-f', "sha=$($indexFile.sha)")
            }
            gh api --method PUT $indexEndpoint @writeArgs --silent
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds $attempt }
          }
          throw "Failed to update the experimental channel index for $tag."
