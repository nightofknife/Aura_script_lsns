name: Reusable Windows release build

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      release_label:
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read release policy
        id: policy
        shell: pwsh
        run: |
          $contract = Get-Content -Raw packaging\release-contract.json | ConvertFrom-Json
          "python_version=$($contract.python.major_minor)" >> $env:GITHUB_OUTPUT

      - name: Set up release Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.policy.outputs.python_version }}
          cache: pip
          cache-dependency-path: requirements/release-*.lock.txt

      - name: Build and validate release profile
        shell: pwsh
        env:
          BUILD_PROFILE: ${{ inputs.profile }}
          RELEASE_LABEL: ${{ inputs.release_label }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -File scripts\package_release.ps1 `
            -Profile $env:BUILD_PROFILE `
            -ReleaseLabel $env:RELEASE_LABEL `
            -OutputRoot ".runtime\artifacts" `
            -AssetRepository $env:GITHUB_REPOSITORY

      - name: Upload validated release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-full-${{ inputs.profile }}
          path: .runtime/artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
