    - name: threshold
      type: Any
      required: false
      default: 0.9
    - name: use_grayscale
      type: Any
      required: false
      default: true
    - name: timeout_sec
      type: Any
      required: false
      default: 8.0
    - name: interval_sec
      type: Any
      required: false
      default: 0.2
    - name: stable_scans
      type: Any
      required: false
      default: 2
    - name: move_duration_sec
      type: Any
      required: false
      default: 0.1
    - name: after_click_sec
      type: Any
