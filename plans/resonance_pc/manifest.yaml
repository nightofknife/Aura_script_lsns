      required: true
      default: null
    - name: region
      type: Any
      required: false
      default: null
    - name: drag_increase
      type: Any
      required: false
      default: null
    - name: drag_decrease
      type: Any
      required: false
      default: null
    - name: max_attempts
      type: Any
      required: false
