  steps:
    require_resolution:
      action: resonance_pc.require_client_resolution

    run:
      action: resonance_pc.auto_combined_commerce_flow
      params:
        order: "{{ inputs.order | default('trade_first') }}"
        total_fatigue_budget: "{{ inputs.total_fatigue_budget | default(700) }}"
        trade_inputs: "{{ inputs.trade_inputs | default({}) }}"
        passenger_inputs: "{{ inputs.passenger_inputs | default({}) }}"
        recovery_snapshot: "{{ inputs.recovery_snapshot | default(none) }}"
      depends_on: require_resolution
  returns:
    success: "{{ nodes.run.output.success }}"
    status: "{{ nodes.run.output.status }}"
    reason: "{{ nodes.run.output.reason }}"
    failure_stage: "{{ nodes.run.output.failure_stage }}"
    order: "{{ nodes.run.output.order }}"
    preflight: "{{ nodes.run.output.preflight }}"
    trade: "{{ nodes.run.output.trade }}"
    passenger: "{{ nodes.run.output.passenger }}"
    total_fatigue_budget: "{{ nodes.run.output.total_fatigue_budget }}"
    expected_fatigue_used: "{{ nodes.run.output.expected_fatigue_used }}"
    remaining_fatigue: "{{ nodes.run.output.remaining_fatigue }}"
    end_city_id: "{{ nodes.run.output.end_city_id }}"
    page_state: "{{ nodes.run.output.page_state }}"
