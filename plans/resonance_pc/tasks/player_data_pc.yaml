player_data_refresh:
  meta:
    title: Resonance Player Data Refresh (PC)
    description: Refresh location, player profile/status, warehouse and character data from the PC client.
    entry_point: true
    concurrency: exclusive
    inputs:
      - name: stages
        type: list
        required: false
        default: [location, profile, inventory, characters]
        item:
          name: stage
          type: enum
          required: true
          enum: [location, profile, inventory, characters]
      - name: inventory_categories
        type: list
        required: false
        default: [items]
        item:
          name: inventory_category
          type: enum
          required: true
          enum: [items, materials]

  steps:
    refresh:
      action: resonance_pc.player_data_refresh
      timeout_sec: 900
      params:
        stages: "{{ inputs.stages }}"
        inventory_categories: "{{ inputs.inventory_categories }}"

  returns:
    player_data: "{{ nodes.refresh.output }}"

player_data_get_latest:
  meta:
    title: Resonance Player Data Latest (PC)
    description: Read latest cached Resonance PC player data.
    inputs: []

  steps:
    get_latest:
      action: resonance_pc.player_data_get_latest
      params: {}

  returns:
    player_data: "{{ nodes.get_latest.output }}"
