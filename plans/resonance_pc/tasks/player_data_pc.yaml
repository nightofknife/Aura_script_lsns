player_data_refresh:
  meta:
    role: user_tool
    domain: 用户数据
    title: Resonance Player Data Refresh (PC)
    description: Refresh selected player data and optionally read current visible prison products without scrolling.
    entry_point: true
    concurrency: exclusive
    inputs:
      - name: stages
        type: list
        required: false
        default: [location, profile, inventory, characters]
        item:
          name: stage
          type: enum
          required: true
          enum: [location, profile, inventory, characters, prison_products]
      - name: prison_product_goods
        type: list
        description: 监狱成品筛选；不指定、null 或空列表表示识别当前可见全部成品，不滚动列表。
        required: false
        nullable: true
        default: null
        item:
          name: goods
          type: string
          required: true
      - name: profile_sections
        type: list
        required: false
        default: [cargo, clarity, fatigue]
        item:
          name: profile_section
          type: enum
          required: true
          enum: [cargo, clarity, fatigue, sparkling_water, bento_count, work_meals, love_bentos]
      - name: inventory_categories
        type: list
        required: false
        default: [items]
        item:
          name: inventory_category
          type: enum
          required: true
          enum: [items, materials, equipment]

  steps:
    require_resolution:
      action: resonance_pc.require_client_resolution

    refresh:
      action: resonance_pc.player_data_refresh
      timeout_sec: 900
      params:
        stages: "{{ inputs.stages }}"
        inventory_categories: "{{ inputs.inventory_categories }}"
        profile_sections: "{{ inputs.profile_sections }}"
        prison_product_goods: "{{ inputs.prison_product_goods }}"
      depends_on: require_resolution

  returns:
    player_data: "{{ nodes.refresh.output }}"

player_data_get_latest:
  meta:
    role: internal
    domain: 商贸运输
    title: Resonance Player Data Latest (PC)
    description: Read latest cached Resonance PC player data.
    inputs: []

  steps:
    get_latest:
      action: resonance_pc.player_data_get_latest
      params: {}

  returns:
    player_data: "{{ nodes.get_latest.output }}"
