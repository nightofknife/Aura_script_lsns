team_recommendation_pc:
  meta:
    title: Fixed Team Recommendations (PC)
    description: Match cached player characters and weapons against fixed team guides.
    entry_point: true
    inputs: []

  steps:
    require_resolution:
      action: resonance_pc.require_client_resolution

    recommend:
      action: resonance_pc.team_recommendations
      params: {}
      depends_on: require_resolution

  returns:
    team_recommendations: "{{ nodes.recommend.output }}"
