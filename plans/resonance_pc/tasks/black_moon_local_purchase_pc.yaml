  steps:
    begin_visit:
      action: resonance_pc.begin_black_moon_local_visit
      params:
        city_name: "{{ inputs.city_name }}"
        purchase_table: "{{ inputs.purchase_table }}"
        record_scope: "{{ inputs.record_scope }}"
        exit_target: "{{ inputs.exit_target }}"
    require_resolution:
      action: resonance_pc.require_client_resolution
      depends_on: begin_visit
      when: "{{ nodes.begin_visit.output.run }}"
    enter_shop:
      action: resonance_pc.prepare_black_moon_local_shop_step
      depends_on: {require_resolution: 'success|skipped'}
      when: "{{ nodes.begin_visit.output.run }}"
      timeout_sec: 75
      params: {step: enter_shop}
    select_local:
      action: resonance_pc.prepare_black_moon_local_shop_step
      depends_on: {enter_shop: 'success|skipped'}
      when: "{{ nodes.begin_visit.output.run }}"
      timeout_sec: 75
      params: {step: select_local}
    enable_batch:
      action: resonance_pc.prepare_black_moon_local_shop_step
      depends_on: {select_local: 'success|skipped'}
      when: "{{ nodes.begin_visit.output.run }}"
      timeout_sec: 75
      params: {step: enable_batch}
    select_goods:
      action: resonance_pc.select_black_moon_local_goods
      depends_on: {enable_batch: 'success|skipped'}
      when: "{{ nodes.begin_visit.output.run }}"
      timeout_sec: 240
      params:
        purchase_table: "{{ nodes.begin_visit.output.purchase_table }}"
    submit_purchase:
      action: resonance_pc.submit_black_moon_local_visit
      depends_on: {select_goods: 'success|skipped'}
      when: "{{ nodes.begin_visit.output.run }}"
      params:
        visit: "{{ nodes.begin_visit.output }}"
        selection: "{{ nodes.select_goods.output }}"
    complete_visit:
      action: resonance_pc.complete_black_moon_local_visit
      depends_on: {submit_purchase: 'success|skipped'}
      when: "{{ nodes.begin_visit.output.run }}"
      timeout_sec: 40
      params:
        visit: "{{ nodes.begin_visit.output }}"
        submission: "{{ nodes.submit_purchase.output }}"
    finish_visit:
      action: resonance_pc.finish_black_moon_local_visit
      depends_on: {complete_visit: 'success|skipped'}
      timeout_sec: 80
      params:
        visit: "{{ nodes.begin_visit.output }}"
        completion: "{{ nodes.complete_visit.output | default({}) }}"
  returns:
    success: "{{ nodes.finish_visit.output.success }}"
    status: "{{ nodes.finish_visit.output.status }}"
    reason: "{{ nodes.finish_visit.output.reason }}"
    city_key: "{{ nodes.finish_visit.output.city_key }}"
    week_key: "{{ nodes.finish_visit.output.week_key }}"
    completed_this_week: "{{ nodes.finish_visit.output.completed_this_week }}"
    has_selected_goods: "{{ nodes.finish_visit.output.has_selected_goods }}"
    matched_item_ids: "{{ nodes.finish_visit.output.matched_item_ids }}"
    purchase_verified: "{{ nodes.finish_visit.output.purchase_verified }}"
    page_state: "{{ nodes.finish_visit.output.page_state }}"
