              "12": {name: city_12, type: number, required: false, min: 1, max: 20}
              "13": {name: city_13, type: number, required: false, min: 1, max: 20}
              "14": {name: city_14, type: number, required: false, min: 1, max: 20}
              "15": {name: city_15, type: number, required: false, min: 1, max: 20}
              "16": {name: city_16, type: number, required: false, min: 1, max: 20}
              "17": {name: city_17, type: number, required: false, min: 1, max: 20}
              "18": {name: city_18, type: number, required: false, min: 1, max: 20}
              "19": {name: city_19, type: number, required: false, min: 1, max: 20}
              "20": {name: city_20, type: number, required: false, min: 1, max: 20}
              "21": {name: city_21, type: number, required: false, min: 1, max: 20}
      - name: product_unlocks
        type: dict
        required: false
        default:
          mode: all
          product_ids: []
        properties:
          mode:
            name: mode
            type: string
            required: false
            default: all
            enum:
              - all
              - only
          product_ids:
            name: product_ids
            type: list
            required: false
            default: []
            item:
              name: product_id
              type: string
              required: true
      - name: use_fatigue_medicine
        type: boolean
        required: false
        default: false
      - name: allowed_fatigue_medicines
        type: list
        required: false
        default: []
      - name: fatigue_medicine_max_uses
        type: number
        strict_integer: true
        required: false
        default: 4
      - name: arrival_timeout_seconds
        type: number
        required: false
        default: 3600
        min: 1
      - name: auto_cape_island_investment
        type: boolean
        required: false
        default: true
      - name: auto_trade_goods_investment
        type: boolean
        required: false
        default: false
      - name: trade_goods_investment_mode
        type: number
        strict_integer: true
        required: false
        default: 10
        min: 1
        max: 20
      - name: auto_pickup
        type: boolean
        required: false
        default: false
      - name: auto_pickup_interval_sec
        type: number
        required: false
        default: 0.5
        min: 0.1
        max: 60
        description: "自动拣货两次点击之间的最短间隔（秒），不改变鼠标按住时长。"
