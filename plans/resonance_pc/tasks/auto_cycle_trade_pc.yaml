      - name: recovery_snapshot
        type: dict
        required: false
        properties:
          status:
            name: status
            type: dict
            required: true
            properties:
              fatigue:
                name: fatigue
                type: dict
                required: true
                properties:
                  current:
                    name: current
                    type: number
                    required: true
                    min: 0
                  max:
                    name: max
                    type: number
                    required: true
                    min: 1
          recovery:
            name: recovery
            type: dict
            required: true
            properties:
              sparkling_water:
                name: sparkling_water
                type: dict
                required: false
                properties:
                  remaining_free_uses:
                    name: remaining_free_uses
                    type: number
                    required: true
                    min: 0
                    max: 6
                  daily_free_limit:
                    name: daily_free_limit
                    type: number
                    required: true
                    min: 1
                    max: 6
                  requires_refresh:
                    name: requires_refresh
                    type: boolean
                    required: false
                    enum:
                    - false
              bento_count:
                name: bento_count
                type: dict
                required: false
                properties:
                  count:
                    name: count
                    type: number
                    required: true
                    min: 0
                    max: 12
