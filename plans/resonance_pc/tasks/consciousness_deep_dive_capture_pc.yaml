consciousness_deep_dive_capture_pc:
  meta:
    title: Consciousness Deep Dive View Capture (PC)
    description: Capture four calibrated board views for recognition material.
    entry_point: true
    inputs: []

  steps:
    wait_before_first_drag:
      action: plans/aura_base/sleep
      params: {seconds: 2.0}

    drag_560_chunk_1:
      action: plans/aura_base/drag
      params: {start_x: 640, start_y: 480, end_x: 640, end_y: 160, duration: 0.5}
      depends_on: wait_before_first_drag
    wait_560_chunk_1:
      action: plans/aura_base/sleep
      params: {seconds: 0.2}
      depends_on: drag_560_chunk_1
