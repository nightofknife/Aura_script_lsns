    wait_before_560_capture:
      action: plans/aura_base/sleep
      params: {seconds: 0.4}
      depends_on: drag_560_chunk_2
    capture_560:
      action: resonance_pc.capture_consciousness_deep_dive_view
      params: {displacement_px: 560}
      depends_on: wait_before_560_capture
    wait_after_560_capture:
      action: plans/aura_base/sleep
      params: {seconds: 0.2}
      depends_on: capture_560

