consciousness_deep_dive_capture_drag_chunk_pc:
  meta:
    title: Consciousness Deep Dive Capture Drag Chunk (PC)
    description: Perform one bounded board drag and its inter-chunk wait.
    entry_point: false
    inputs:
      - name: chunk_px
        type: number
        required: true
        min: 1
        max: 320

  steps:
    drag_chunk:
      action: plans/aura_base/drag
      params:
        start_x: 640
        start_y: 480
        end_x: 640
        end_y: "{{ 480 - inputs.chunk_px }}"
        duration: 0.5

    wait_after_chunk:
      action: plans/aura_base/sleep
      params: {seconds: 0.2}
      depends_on: drag_chunk

  returns:
    success: true
    chunk_px: "{{ inputs.chunk_px }}"


consciousness_deep_dive_capture_view_pc:
  meta:
    title: Consciousness Deep Dive Capture View (PC)
    description: Reach and capture one calibrated board displacement.
    entry_point: false
    inputs:
      - name: displacement_px
        type: number
        required: true
        min: 1
      - name: drag_chunks
        type: list
        required: true
        min_items: 1

  steps:
    drag_chunks:
      action: aura.run_task
      loop:
        for_each: "{{ inputs.drag_chunks }}"
        parallelism: 1
      params:
        task_ref: "tasks:consciousness_deep_dive_capture_pc.yaml:consciousness_deep_dive_capture_drag_chunk_pc"
        inputs:
          chunk_px: "{{ loop.item }}"

    wait_before_capture:
      action: plans/aura_base/sleep
      params: {seconds: 0.2}
      depends_on: drag_chunks

    capture_view:
      action: resonance_pc.capture_consciousness_deep_dive_view
      params:
        displacement_px: "{{ inputs.displacement_px }}"
      depends_on: wait_before_capture

    wait_after_capture:
      action: plans/aura_base/sleep
      params: {seconds: 0.2}
      depends_on: capture_view

  returns:
    success: "{{ nodes.capture_view.output.success }}"
    status: "{{ nodes.capture_view.output.status }}"
    displacement_px: "{{ nodes.capture_view.output.displacement_px }}"
    timestamp: "{{ nodes.capture_view.output.timestamp }}"
    output_path: "{{ nodes.capture_view.output.output_path }}"
    relative_path: "{{ nodes.capture_view.output.relative_path }}"
    image_size: "{{ nodes.capture_view.output.image_size }}"


consciousness_deep_dive_capture_pc:
  meta:
    title: Consciousness Deep Dive View Capture (PC)
    description: Capture four calibrated board views for recognition material.
    entry_point: true
    inputs:
      - name: sensitivity
        type: string
        required: false
        default: slow
        enum: [slow, fast]

  steps:
    prepare_profile:
      action: resonance_pc.prepare_consciousness_deep_dive_capture_profile
      params:
        sensitivity: "{{ inputs.sensitivity | default('slow') }}"

    wait_before_first_drag:
      action: plans/aura_base/sleep
      params: {seconds: 2.0}
      depends_on: prepare_profile

    capture_views:
      action: aura.run_task
      loop:
        for_each: "{{ nodes.prepare_profile.output.views }}"
        parallelism: 1
      params:
        task_ref: "tasks:consciousness_deep_dive_capture_pc.yaml:consciousness_deep_dive_capture_view_pc"
        inputs:
          displacement_px: "{{ loop.item.displacement_px }}"
          drag_chunks: "{{ loop.item.drag_chunks }}"
      depends_on: wait_before_first_drag

    collect_results:
      action: resonance_pc.collect_consciousness_deep_dive_capture_results
      params:
        profile: "{{ nodes.prepare_profile.output }}"
        runs: "{{ nodes.capture_views.output }}"
      depends_on: capture_views

  returns:
    success: "{{ nodes.collect_results.output.success }}"
    status: "{{ nodes.collect_results.output.status }}"
    sensitivity: "{{ nodes.collect_results.output.sensitivity }}"
    capture_displacements: "{{ nodes.collect_results.output.capture_displacements }}"
    capture_count: "{{ nodes.collect_results.output.capture_count }}"
    captures: "{{ nodes.collect_results.output.captures }}"
