    reason: "{{ nodes.run_structural.output.reason }}"
    configured_types: "{{ nodes.run_structural.output.configured_types }}"
    native_stopped: "{{ nodes.run_structural.output.native_stopped }}"
    observed: "{{ nodes.run_structural.output.observed }}"
    statistics_complete: "{{ nodes.run_structural.output.statistics_complete }}"
    page_after: "{{ nodes.run_structural.output.page_after }}"
    ready_for_next: "{{ nodes.run_structural.output.ready_for_next }}"


auto_battle_gp_batch_pc:
  meta:
    role: internal
    domain: 战斗
    title: Auto Battle PC GP Batch
    description: Group GP jobs by action_summary and structural_exploration, then dispatch in order.
    inputs:
      - name: jobs
        type: list
        required: true
        min_items: 1
  steps:
    group_gp_jobs:
      action: resonance_pc.group_gp_jobs
      params:
        jobs: "{{ inputs.jobs }}"

    assert_no_unknown_gp_jobs:
      action: plans/aura_base/assert_condition
      params:
        condition: "{{ (nodes.group_gp_jobs.output.unknown_jobs | length) == 0 }}"
        message: "contains unsupported GP route_id"
      depends_on: group_gp_jobs

    prepare_gp_category_order:
      action: plans/aura_base/log
      params:
        message: "prepare GP category order"
      depends_on: assert_no_unknown_gp_jobs
      outputs:
        first_category: "{{ (nodes.group_gp_jobs.output.category_order | first) if (nodes.group_gp_jobs.output.category_order | length) > 0 else '' }}"
        second_category: "{{ nodes.group_gp_jobs.output.category_order[1] if (nodes.group_gp_jobs.output.category_order | length) > 1 else '' }}"

    switch_first_action_summary:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "\u884c\u52a8\u6c47\u603b"
        region: [980, 270, 140, 290]
        match_mode: "contains"
      depends_on: prepare_gp_category_order
      when: "{{ nodes.prepare_gp_category_order.first_category == 'action_summary' }}"

    switch_first_structural:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "\u6784\u6790\u52d8\u63a2"
        region: [980, 270, 140, 290]
        match_mode: "contains"
      depends_on: prepare_gp_category_order
      when: "{{ nodes.prepare_gp_category_order.first_category == 'structural_exploration' }}"

    wait_after_first_gp_switch:
      action: plans/aura_base/sleep
      params:
        seconds: 2.0
      depends_on:
        all:
          - switch_first_action_summary: "success|failed|skipped"
          - switch_first_structural: "success|failed|skipped"
      when: "{{ nodes.prepare_gp_category_order.first_category != '' }}"

    run_first_action_summary_batch:
      action: aura.run_task
      params:
        task_ref: "tasks:auto_battle_dispatch_pc.yaml:auto_battle_gp_action_summary_batch_pc"
        inputs:
          jobs: "{{ nodes.group_gp_jobs.output.action_summary_jobs }}"
      depends_on: wait_after_first_gp_switch
      when: "{{ nodes.prepare_gp_category_order.first_category == 'action_summary' and (nodes.group_gp_jobs.output.action_summary_jobs | length) > 0 }}"

    run_first_structural_batch:
      action: aura.run_task
      params:
        task_ref: "tasks:auto_battle_dispatch_pc.yaml:auto_battle_gp_structural_batch_pc"
        inputs:
          jobs: "{{ nodes.group_gp_jobs.output.structural_exploration_jobs }}"
      depends_on: wait_after_first_gp_switch
      when: "{{ nodes.prepare_gp_category_order.first_category == 'structural_exploration' and (nodes.group_gp_jobs.output.structural_exploration_jobs | length) > 0 }}"

    click_back_after_first_gp_batch:
      action: plans/aura_base/find_image_and_click
      params:
        region: [10, 5, 160, 70]
        template: "templates/battle/navigation/back_button.png"
        threshold: 0.9
        use_grayscale: true
        after_click_sec: 1.0
        timeout: 8.0
        interval: 0.2
        stable_scans: 2
        stable_center_tolerance_px: 2
        move_duration: 0.1
        required: true
      depends_on:
        all:
          - run_first_action_summary_batch: "success|failed|skipped"
          - run_first_structural_batch: "success|failed|skipped"
      when: "{{ nodes.prepare_gp_category_order.second_category != '' }}"

    wait_after_back_first_gp_batch:
      action: plans/aura_base/sleep
      params:
        seconds: 1.0
      depends_on:
        click_back_after_first_gp_batch: "success|skipped"
      when: "{{ nodes.prepare_gp_category_order.second_category != '' }}"

    switch_second_action_summary:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "\u884c\u52a8\u6c47\u603b"
        region: [980, 270, 140, 290]
        match_mode: "contains"
      depends_on:
        wait_after_back_first_gp_batch: "success|skipped"
      when: "{{ nodes.prepare_gp_category_order.second_category == 'action_summary' }}"

    switch_second_structural:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "\u6784\u6790\u52d8\u63a2"
        region: [980, 270, 140, 290]
        match_mode: "contains"
      depends_on:
        wait_after_back_first_gp_batch: "success|skipped"
      when: "{{ nodes.prepare_gp_category_order.second_category == 'structural_exploration' }}"

    wait_after_second_gp_switch:
      action: plans/aura_base/sleep
      params:
        seconds: 2.0
      depends_on:
        all:
          - switch_second_action_summary: "success|failed|skipped"
          - switch_second_structural: "success|failed|skipped"
      when: "{{ nodes.prepare_gp_category_order.second_category != '' }}"

    run_second_action_summary_batch:
      action: aura.run_task
      params:
        task_ref: "tasks:auto_battle_dispatch_pc.yaml:auto_battle_gp_action_summary_batch_pc"
        inputs:
          jobs: "{{ nodes.group_gp_jobs.output.action_summary_jobs }}"
      depends_on:
        wait_after_second_gp_switch: "success|skipped"
      when: "{{ nodes.prepare_gp_category_order.second_category == 'action_summary' and (nodes.group_gp_jobs.output.action_summary_jobs | length) > 0 }}"

    run_second_structural_batch:
      action: aura.run_task
      params:
        task_ref: "tasks:auto_battle_dispatch_pc.yaml:auto_battle_gp_structural_batch_pc"
        inputs:
          jobs: "{{ nodes.group_gp_jobs.output.structural_exploration_jobs }}"
      depends_on:
        wait_after_second_gp_switch: "success|skipped"
      when: "{{ nodes.prepare_gp_category_order.second_category == 'structural_exploration' and (nodes.group_gp_jobs.output.structural_exploration_jobs | length) > 0 }}"

    click_back_after_single_gp_batch:
      action: plans/aura_base/find_image_and_click
      params:
        region: [10, 5, 160, 70]
        template: "templates/battle/navigation/back_button.png"
        threshold: 0.9
        use_grayscale: true
        after_click_sec: 1.0
        timeout: 8.0
        interval: 0.2
        stable_scans: 2
        stable_center_tolerance_px: 2
        move_duration: 0.1
        required: true
      depends_on:
        all:
          - run_first_action_summary_batch: "success|failed|skipped"
          - run_first_structural_batch: "success|failed|skipped"
      when: "{{ nodes.prepare_gp_category_order.first_category != '' and nodes.prepare_gp_category_order.second_category == '' }}"

    click_back_after_second_gp_batch:
      action: plans/aura_base/find_image_and_click
      params:
        region: [10, 5, 160, 70]
        template: "templates/battle/navigation/back_button.png"
        threshold: 0.9
        use_grayscale: true
        after_click_sec: 1.0
        timeout: 8.0
        interval: 0.2
        stable_scans: 2
        stable_center_tolerance_px: 2
        move_duration: 0.1
        required: true
      depends_on:
        all:
          - run_second_action_summary_batch: "success|failed|skipped"
          - run_second_structural_batch: "success|failed|skipped"
      when: "{{ nodes.prepare_gp_category_order.second_category != '' }}"

  returns:
    success: true
    category: "gp"
    sub_category_order: "{{ nodes.group_gp_jobs.output.category_order }}"
    action_summary_job_count: "{{ nodes.group_gp_jobs.output.action_summary_jobs | length }}"
    structural_job_count: "{{ nodes.group_gp_jobs.output.structural_exploration_jobs | length }}"


auto_battle_enter_terminal_pc:
  meta:
    role: internal
    domain: 战斗
    title: Enter Battle Terminal Category
    description: Enter the battle terminal from the main page and select CT or GP.
    entry_point: false
    inputs:
      - name: main_category
        type: string
        required: true
        enum: [ct, gp]
  steps:
    require_resolution:
      action: resonance_pc.require_client_resolution
    wait_terminal:
      action: plans/aura_base/wait_for_text
      params:
        text_to_find: "\u4f5c\u6218\u7ec8\u7aef"
        timeout: 3.0
        interval: 0.5
        region: [1100, 380, 150, 120]
        match_mode: contains
      depends_on: require_resolution
    click_terminal:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "\u4f5c\u6218\u7ec8\u7aef"
        region: [1100, 380, 150, 120]
        match_mode: contains
        required: true
      depends_on: wait_terminal
    settle_terminal:
      action: plans/aura_base/sleep
      params:
        seconds: 1.0
      depends_on: click_terminal
    select_main_category:
      action: plans/aura_base/find_image_and_click
      params:
        template: "{{ 'templates/battle/dispatch/category_ct.png' if inputs.main_category == 'ct' else 'templates/battle/dispatch/category_gp.png' }}"
        timeout: 8.0
        interval: 0.2
        region: [20, 180, 200, 160]
        threshold: 0.95
        use_grayscale: true
        required: true
      depends_on: settle_terminal
    settle_category:
      action: plans/aura_base/sleep
      params:
        seconds: 2.0
      depends_on: select_main_category
  returns:
    entered: true
    main_category: "{{ inputs.main_category }}"


auto_battle_enter_category_pc:
  meta:
    role: internal
    domain: 战斗
    title: Enter Battle Play Category
    description: Open one play category inside an already selected CT or GP terminal.
    entry_point: false
    inputs:
      - name: main_category
        type: string
        required: true
        enum: [ct, gp]
      - name: sub_category
        type: string
        required: true
        enum: [tie_an, regional_ops_center, action_summary, structural_exploration]
  steps:
    require_category_pair:
      action: plans/aura_base/assert_condition
      params:
        condition: "{{ (inputs.main_category == 'ct' and inputs.sub_category in ['tie_an', 'regional_ops_center']) or (inputs.main_category == 'gp' and inputs.sub_category in ['action_summary', 'structural_exploration']) }}"
        message: Incompatible battle terminal and play category.
    select_sub_category:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "{{ {'tie_an': '\u94c1\u5b89\u5c40', 'regional_ops_center': '\u533a\u57df\u4f5c\u6218\u4e2d\u5fc3', 'action_summary': '\u884c\u52a8\u6c47\u603b', 'structural_exploration': '\u6784\u6790\u52d8\u63a2'}[inputs.sub_category] }}"
        region: "{{ [670, 370, 530, 50] if inputs.main_category == 'ct' else [980, 270, 140, 290] }}"
        match_mode: contains
        timeout: 8.0
        interval: 0.5
        required: true
      depends_on: require_category_pair
    settle_sub_category:
      action: plans/aura_base/sleep
      params:
        seconds: 2.0
      depends_on: select_sub_category
  returns:
    entered: true
    main_category: "{{ inputs.main_category }}"
    sub_category: "{{ inputs.sub_category }}"


auto_battle_dispatch_pc:
  meta:
    role: user_task
    domain: 战斗
    title: Auto Battle PC Dispatch
    description: Resolve a daily plan, execute ordinary battles in list order, then run structural exploration and return to main.
    entry_point: true
    inputs:
      - &battle_plan_jobs
        name: jobs
        label: Ordinary Battle Jobs
        type: list
        required: false
        max_items: 54
        item:
          name: job_item
          type: dict
          properties:
            route_id:
              name: route_id
              type: string
              required: true
            run_count:
              name: run_count
              type: number
              strict_integer: true
              required: false
              default: 1
              min: 1
              max: 9999
            difficulty:
              name: difficulty
              type: number
              required: false
              enum: [1, 2, 3, 4, 5, 6]
            stage:
              name: stage
              type: number
              required: false
              enum: [1, 2, 3]
            threat_level:
              name: threat_level
              type: number
              required: false
              min: 1
            formation_index:
              name: formation_index
              type: number
              required: false
              min: 1
              max: 4
            capture_count:
              name: capture_count
              type: number
              required: false
              min: 1
      - &battle_plan_structural_types
        name: structural_types
        label: Structural Target Priority
        description: Ordered independent target types; no run count.
        type: list
        required: false
      - name: weekly_plan
        label: Weekly Battle Plan
        description: Persistent seven-day plan; mutually exclusive with direct jobs or structural_types, including explicit empty lists.
        type: dict
        required: false
        properties:
          mon: &battle_plan_day
            name: battle_day
            type: dict
            required: false
            properties:
              jobs: *battle_plan_jobs
              structural_types: *battle_plan_structural_types
              stop_on_failure:
                name: stop_on_failure
                type: boolean
                required: false
          tue: *battle_plan_day
          wed: *battle_plan_day
          thu: *battle_plan_day
          fri: *battle_plan_day
          sat: *battle_plan_day
          sun: *battle_plan_day
          schema_version:
            name: schema_version
            type: number
            strict_integer: true
            required: false
            enum: [1]
          days:
            name: days
            type: dict
            required: false
            properties:
              mon: *battle_plan_day
              tue: *battle_plan_day
              wed: *battle_plan_day
              thu: *battle_plan_day
              fri: *battle_plan_day
              sat: *battle_plan_day
              sun: *battle_plan_day
      - name: stop_on_failure
        label: Legacy Stop On Failure
        description: Compatibility input only; defeat or insufficient stamina always ends this battle plan.
        type: boolean
        required: false
        default: true
  steps:
    execute:
      action: resonance_pc.execute_battle_plan
      params:
        jobs: "{{ inputs.jobs | default(none) }}"
        structural_types: "{{ inputs.structural_types | default(none) }}"
        weekly_plan: "{{ inputs.weekly_plan | default(none) }}"
  returns:
    schema: "{{ nodes.execute.output.schema }}"
    effective_date: "{{ nodes.execute.output.effective_date }}"
    weekday: "{{ nodes.execute.output.weekday }}"
    status: "{{ nodes.execute.output.status }}"
    stop_reason: "{{ nodes.execute.output.stop_reason }}"
    counts: "{{ nodes.execute.output.counts }}"
    job_results: "{{ nodes.execute.output.job_results }}"
    results: "{{ nodes.execute.output.results }}"
    structural: "{{ nodes.execute.output.structural }}"
    cleanup: "{{ nodes.execute.output.cleanup }}"
    continue_workflow: "{{ nodes.execute.output.continue_workflow }}"
