auto_battle_ct_tie_an_run_one_pc:
  meta:
    role: internal
    domain: 战斗
    title: Auto Battle PC CT TieAn Run One
    description: Execute one CT tie_an job, preferring one sweep before actual combat.
    inputs:
      - name: route_id
        type: string
        required: true
      - name: city_name
        type: string
        required: true
      - name: mission_type
        type: string
        required: true
      - name: stage
        type: number
        required: false
      - name: difficulty
        type: number
        required: false
      - name: formation_index
        type: number
        required: false
      - name: capture_count
        type: number
        required: false
      - name: control_cid
        type: string
        required: false
  steps:
    select_city:
      action: resonance_pc.select_ordered_city
      params:
        target_city_name: "{{ inputs.city_name }}"
        city_order:
          - "\u4fee\u683c\u91cc\u57ce"
          - "\u66fc\u5fb7\u77ff\u573a"
          - "7\u53f7\u81ea\u7531\u6e2f"
          - "\u6f84\u660e\u6570\u636e\u4e2d\u5fc3"
          - "\u6d77\u89d2\u57ce"
          - "\u963f\u59ae\u5854\u53d1\u5c04\u4e2d\u5fc3"
          - "\u5c9a\u5fc3\u57ce"
          - "\u8d21\u9732\u57ce"
        region: [45, 80, 255, 550]
        drag_up: [220, 560, 220, 260]
        drag_down: [220, 260, 220, 560]
        max_attempts: 15
        drag_duration_sec: 0.5
        drag_hold_before_release_sec: 0.5
        after_drag_sec: 0.5
        match_mode: "contains"

    wait_after_select_city:
      action: plans/aura_base/sleep
      params:
        seconds: 0.5
      depends_on: select_city

    click_expel_task:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "\u9a71\u9010\u4efb\u52a1"
        region: [100, 650, 300, 40]
        match_mode: "contains"
      depends_on: wait_after_select_city
      when: "{{ inputs.mission_type == 'expel' }}"

    click_bounty_task:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "\u60ac\u8d4f\u4efb\u52a1"
        region: [100, 650, 300, 40]
        match_mode: "contains"
      depends_on: wait_after_select_city
      when: "{{ inputs.mission_type == 'bounty' }}"

    assert_task_type_clicked:
      action: plans/aura_base/assert_condition
      params:
        condition: "{{ (inputs.mission_type == 'expel' and (nodes.click_expel_task.output | default(false))) or (inputs.mission_type == 'bounty' and (nodes.click_bounty_task.output | default(false))) }}"
        message: "failed to select mission type"
      depends_on:
        all:
          - click_expel_task: "success|failed|skipped"
          - click_bounty_task: "success|failed|skipped"

    wait_after_task_type:
      action: plans/aura_base/sleep
      params:
        seconds: 0.5
      depends_on: assert_task_type_clicked

    click_stage_1:
      action: plans/aura_base/click
      params:
        x: 630
        y: 660
      depends_on: wait_after_task_type
      when: "{{ inputs.mission_type == 'expel' and inputs.stage == 1 }}"

    click_stage_2:
      action: plans/aura_base/click
      params:
        x: 900
        y: 660
      depends_on: wait_after_task_type
      when: "{{ inputs.mission_type == 'expel' and inputs.stage == 2 }}"

    click_stage_3:
      action: plans/aura_base/click
      params:
        x: 1100
        y: 660
      depends_on: wait_after_task_type
      when: "{{ inputs.mission_type == 'expel' and inputs.stage == 3 }}"

    stage_selected_marker:
      action: plans/aura_base/log
      params:
        message: "stage selected marker"
      depends_on:
        all:
          - click_stage_1: "success|failed|skipped"
          - click_stage_2: "success|failed|skipped"
          - click_stage_3: "success|failed|skipped"
          - wait_after_task_type: "success"

    click_change_difficulty:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "\u53d8\u66f4\u96be\u5ea6"
        region: [660, 520, 140, 40]
        match_mode: "contains"
      depends_on: stage_selected_marker
      when: "{{ inputs.mission_type == 'expel' and inputs.difficulty is not none }}"

    wait_difficulty_menu:
      action: plans/aura_base/sleep
      params:
        seconds: 0.5
      depends_on:
        click_change_difficulty: "success|skipped"
      when: "{{ inputs.mission_type == 'expel' and inputs.difficulty is not none }}"

    resolve_difficulty_text:
      action: resonance_pc.resolve_difficulty_text
      params:
        difficulty: "{{ inputs.difficulty }}"
      depends_on:
        wait_difficulty_menu: "success|skipped"
      when: "{{ inputs.mission_type == 'expel' and inputs.difficulty is not none }}"

    click_difficulty_text:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "{{ nodes.resolve_difficulty_text.output.difficulty_text }}"
        region: [240, 480, 860, 60]
        match_mode: "contains"
      depends_on:
        resolve_difficulty_text: "success|skipped"
      when: "{{ inputs.mission_type == 'expel' and inputs.difficulty is not none }}"

    click_confirm_difficulty:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "\u786e\u8ba4"
        region: [1100, 600, 100, 100]
        match_mode: "contains"
      depends_on:
        click_difficulty_text: "success|skipped"
      when: "{{ inputs.mission_type == 'expel' and inputs.difficulty is not none }}"

    wait_after_confirm_difficulty:
      action: plans/aura_base/sleep
      params:
        seconds: 0.5
      depends_on:
        click_confirm_difficulty: "success|skipped"
      when: "{{ inputs.mission_type == 'expel' and inputs.difficulty is not none }}"

    try_sweep:
      action: resonance_pc.try_battle_sweep
      params:
        formation_index: "{{ inputs.formation_index | default(none) }}"
        control_cid: "{{ inputs.control_cid | default(none) }}"
        capture_count: "{{ inputs.capture_count | default(none) }}"
      depends_on:
        all:
          - stage_selected_marker: "success"
          - wait_after_confirm_difficulty: "success|skipped"

    click_go_combat_with_difficulty:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "\u524d\u5f80\u4f5c\u6218"
        region: [920, 520, 180, 50]
        match_mode: "contains"
      depends_on: try_sweep
      when: "{{ inputs.mission_type == 'expel' and nodes.try_sweep.output.outcome == 'unsupported' }}"

    click_go_combat_without_difficulty:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "\u524d\u5f80\u4f5c\u6218"
        region: [730, 590, 130, 50]
        match_mode: "contains"
      depends_on: try_sweep
      when: "{{ inputs.mission_type == 'bounty' and nodes.try_sweep.output.outcome == 'unsupported' }}"

    detect_stamina_after_go_combat_with_difficulty:
      action: resonance_pc.detect_and_cancel_insufficient_stamina
      params:
        timeout_sec: 2.0
        interval_sec: 0.2
      depends_on:
        click_go_combat_with_difficulty: "success|skipped"
      when: "{{ inputs.mission_type == 'expel' and nodes.try_sweep.output.outcome == 'unsupported' }}"

    detect_stamina_after_go_combat_without_difficulty:
      action: resonance_pc.detect_and_cancel_insufficient_stamina
      params:
        timeout_sec: 2.0
        interval_sec: 0.2
      depends_on:
        click_go_combat_without_difficulty: "success|skipped"
      when: "{{ inputs.mission_type == 'bounty' and nodes.try_sweep.output.outcome == 'unsupported' }}"

    run_combat_after_go_combat_with_difficulty:
      action: aura.run_task
      params:
        task_ref: "tasks:auto_battle_combat_pc.yaml:auto_battle_combat_pc"
        inputs:
          formation_index: "{{ inputs.formation_index | default(none) }}"
          capture_count: "{{ inputs.capture_count | default(none) }}"
      depends_on:
        detect_stamina_after_go_combat_with_difficulty: "success|skipped"
      when: "{{ inputs.mission_type == 'expel' and nodes.try_sweep.output.outcome == 'unsupported' and not nodes.detect_stamina_after_go_combat_with_difficulty.output.insufficient_stamina }}"

    run_combat_after_go_combat_without_difficulty:
      action: aura.run_task
      params:
        task_ref: "tasks:auto_battle_combat_pc.yaml:auto_battle_combat_pc"
        inputs:
          formation_index: "{{ inputs.formation_index | default(none) }}"
          capture_count: "{{ inputs.capture_count | default(none) }}"
      depends_on:
        detect_stamina_after_go_combat_without_difficulty: "success|skipped"
      when: "{{ inputs.mission_type == 'bounty' and nodes.try_sweep.output.outcome == 'unsupported' and not nodes.detect_stamina_after_go_combat_without_difficulty.output.insufficient_stamina }}"

  returns:
    success: true
    route_id: "{{ inputs.route_id }}"
    city_name: "{{ inputs.city_name }}"
    mission_type: "{{ inputs.mission_type }}"
    outcome: "{{ nodes.try_sweep.output.outcome if nodes.try_sweep.output.outcome != 'unsupported' else (('insufficient_stamina' if nodes.detect_stamina_after_go_combat_with_difficulty.output.insufficient_stamina else nodes.run_combat_after_go_combat_with_difficulty.output.outcome) if inputs.mission_type == 'expel' else ('insufficient_stamina' if nodes.detect_stamina_after_go_combat_without_difficulty.output.insufficient_stamina else nodes.run_combat_after_go_combat_without_difficulty.output.outcome)) }}"
    battle_started: "{{ nodes.try_sweep.output.battle_started if nodes.try_sweep.output.outcome != 'unsupported' else ((false if nodes.detect_stamina_after_go_combat_with_difficulty.output.insufficient_stamina else nodes.run_combat_after_go_combat_with_difficulty.output.battle_started) if inputs.mission_type == 'expel' else (false if nodes.detect_stamina_after_go_combat_without_difficulty.output.insufficient_stamina else nodes.run_combat_after_go_combat_without_difficulty.output.battle_started)) }}"
    page_after: "{{ nodes.try_sweep.output.page_after if nodes.try_sweep.output.outcome != 'unsupported' else ((nodes.detect_stamina_after_go_combat_with_difficulty.output.page_after if nodes.detect_stamina_after_go_combat_with_difficulty.output.insufficient_stamina else nodes.run_combat_after_go_combat_with_difficulty.output.page_after) if inputs.mission_type == 'expel' else (nodes.detect_stamina_after_go_combat_without_difficulty.output.page_after if nodes.detect_stamina_after_go_combat_without_difficulty.output.insufficient_stamina else nodes.run_combat_after_go_combat_without_difficulty.output.page_after)) }}"
    ready_for_next: "{{ nodes.try_sweep.output.ready_for_next if nodes.try_sweep.output.outcome != 'unsupported' else ((nodes.detect_stamina_after_go_combat_with_difficulty.output.ready_for_next if nodes.detect_stamina_after_go_combat_with_difficulty.output.insufficient_stamina else nodes.run_combat_after_go_combat_with_difficulty.output.ready_for_next) if inputs.mission_type == 'expel' else (nodes.detect_stamina_after_go_combat_without_difficulty.output.ready_for_next if nodes.detect_stamina_after_go_combat_without_difficulty.output.insufficient_stamina else nodes.run_combat_after_go_combat_without_difficulty.output.ready_for_next)) }}"
    branch: "{{ nodes.try_sweep.output.branch if nodes.try_sweep.output.outcome != 'unsupported' else ((nodes.detect_stamina_after_go_combat_with_difficulty.output.branch if nodes.detect_stamina_after_go_combat_with_difficulty.output.insufficient_stamina else nodes.run_combat_after_go_combat_with_difficulty.output.branch) if inputs.mission_type == 'expel' else (nodes.detect_stamina_after_go_combat_without_difficulty.output.branch if nodes.detect_stamina_after_go_combat_without_difficulty.output.insufficient_stamina else nodes.run_combat_after_go_combat_without_difficulty.output.branch)) }}"


auto_battle_ct_tie_an_batch_pc:
  meta:
    role: internal
    domain: 战斗
    title: Auto Battle PC CT TieAn Batch
