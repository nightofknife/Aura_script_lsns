        required: true
      depends_on:
        all:
          - run_second_tie_an_batch: "success|failed|skipped"
          - run_second_regional_ops_batch: "success|failed|skipped"
      when: "{{ nodes.prepare_ct_category_order.second_category != '' }}"

  returns:
    success: true
    category: "ct"
    sub_category_order: "{{ nodes.group_ct_jobs.output.category_order }}"
    tie_an_job_count: "{{ nodes.group_ct_jobs.output.tie_an_jobs | length }}"
    regional_ops_job_count: "{{ nodes.group_ct_jobs.output.regional_ops_jobs | length }}"


auto_battle_gp_action_summary_run_difficulty_pc:
  meta:
    role: internal
    domain: 战斗
    title: Auto Battle PC GP ActionSummary Run Difficulty
    description: Execute one action_summary difficulty inside an opened stage, preferring one sweep before actual combat.
    inputs:
      - name: route_id
        type: string
        required: true
      - name: difficulty
        type: number
        required: true
      - name: formation_index
        type: number
        required: false
      - name: capture_count
        type: number
        required: false
      - name: control_cid
        type: string
        required: false
  steps:
    click_difficulty_1:
      action: plans/aura_base/click
      params:
        x: 215
        y: 600
      when: "{{ inputs.difficulty == 1 }}"

    click_difficulty_2:
      action: plans/aura_base/click
      params:
        x: 400
        y: 600
      when: "{{ inputs.difficulty == 2 }}"

    click_difficulty_3:
      action: plans/aura_base/click
      params:
        x: 585
        y: 600
      when: "{{ inputs.difficulty == 3 }}"

    click_difficulty_4:
      action: plans/aura_base/click
      params:
        x: 770
        y: 600
      when: "{{ inputs.difficulty == 4 }}"

    click_difficulty_5:
      action: plans/aura_base/click
      params:
        x: 950
        y: 600
      when: "{{ inputs.difficulty == 5 }}"

    click_difficulty_6:
      action: plans/aura_base/click
      params:
        x: 1140
        y: 600
      when: "{{ inputs.difficulty == 6 }}"

    wait_after_difficulty:
      action: plans/aura_base/wait_for_text
      params:
        text_to_find: "\u5f00\u59cb\u4f5c\u6218"
        timeout: 4.0
        interval: 0.2
        region: [790, 460, 430, 100]
        match_mode: "contains"
      depends_on:
        all:
          - click_difficulty_1: "success|failed|skipped"
          - click_difficulty_2: "success|failed|skipped"
          - click_difficulty_3: "success|failed|skipped"
          - click_difficulty_4: "success|failed|skipped"
          - click_difficulty_5: "success|failed|skipped"
          - click_difficulty_6: "success|failed|skipped"

    try_sweep:
      action: resonance_pc.try_battle_sweep
      params:
        formation_index: "{{ inputs.formation_index | default(none) }}"
        control_cid: "{{ inputs.control_cid | default(none) }}"
        capture_count: "{{ inputs.capture_count | default(none) }}"
      depends_on: wait_after_difficulty

    click_start_battle:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "\u5f00\u59cb\u4f5c\u6218"
        region: [790, 460, 430, 100]
        match_mode: "contains"
      depends_on: try_sweep
      when: "{{ nodes.try_sweep.output.outcome == 'unsupported' }}"

    assert_start_battle_clicked:
      action: plans/aura_base/assert_condition
      params:
        condition: "{{ nodes.click_start_battle.output | default(false) }}"
        message: "failed to click start battle"
      depends_on:
        click_start_battle: "success|skipped"
      when: "{{ nodes.try_sweep.output.outcome == 'unsupported' }}"

    detect_stamina_after_start_battle:
      action: resonance_pc.detect_and_cancel_insufficient_stamina
      params:
        timeout_sec: 2.0
        interval_sec: 0.2
      depends_on:
        assert_start_battle_clicked: "success|skipped"
      when: "{{ nodes.try_sweep.output.outcome == 'unsupported' }}"

    run_combat_after_start_battle:
      action: aura.run_task
      params:
        task_ref: "tasks:auto_battle_combat_pc.yaml:auto_battle_combat_pc"
        inputs:
          formation_index: "{{ inputs.formation_index | default(none) }}"
          capture_count: "{{ inputs.capture_count | default(none) }}"
      depends_on:
        detect_stamina_after_start_battle: "success|skipped"
      when: "{{ nodes.try_sweep.output.outcome == 'unsupported' and not nodes.detect_stamina_after_start_battle.output.insufficient_stamina }}"

  returns:
    success: true
    route_id: "{{ inputs.route_id }}"
    difficulty: "{{ inputs.difficulty }}"
    outcome: "{{ nodes.try_sweep.output.outcome if nodes.try_sweep.output.outcome != 'unsupported' else ('insufficient_stamina' if nodes.detect_stamina_after_start_battle.output.insufficient_stamina else nodes.run_combat_after_start_battle.output.outcome) }}"
    battle_started: "{{ nodes.try_sweep.output.battle_started if nodes.try_sweep.output.outcome != 'unsupported' else (false if nodes.detect_stamina_after_start_battle.output.insufficient_stamina else nodes.run_combat_after_start_battle.output.battle_started) }}"
    page_after: "{{ nodes.try_sweep.output.page_after if nodes.try_sweep.output.outcome != 'unsupported' else (nodes.detect_stamina_after_start_battle.output.page_after if nodes.detect_stamina_after_start_battle.output.insufficient_stamina else nodes.run_combat_after_start_battle.output.page_after) }}"
    ready_for_next: "{{ nodes.try_sweep.output.ready_for_next if nodes.try_sweep.output.outcome != 'unsupported' else (nodes.detect_stamina_after_start_battle.output.ready_for_next if nodes.detect_stamina_after_start_battle.output.insufficient_stamina else nodes.run_combat_after_start_battle.output.ready_for_next) }}"
    branch: "{{ nodes.try_sweep.output.branch if nodes.try_sweep.output.outcome != 'unsupported' else (nodes.detect_stamina_after_start_battle.output.branch if nodes.detect_stamina_after_start_battle.output.insufficient_stamina else nodes.run_combat_after_start_battle.output.branch) }}"


auto_battle_gp_action_summary_run_group_pc:
  meta:
    role: internal
    domain: 战斗
    title: Auto Battle PC GP ActionSummary Run Group
    description: Execute one consecutive action_summary stage group.
    inputs:
      - name: route_id
        type: string
        required: true
      - name: gp_group_name
        type: string
        required: true
      - name: gp_stage_name
        type: string
        required: true
      - name: jobs
        type: list
        required: true
        min_items: 1
      - name: return_to_list
        type: boolean
        required: false
        default: true
      - name: control_cid
        type: string
        required: false
  steps:
    click_group_text:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "{{ inputs.gp_group_name }}"
        region: [130, 100, 140, 250]
        match_mode: "contains"

    assert_group_text_clicked:
      action: plans/aura_base/assert_condition
      params:
        condition: "{{ nodes.click_group_text.output }}"
        message: "failed to click action_summary group"
      depends_on: click_group_text

    wait_after_group_click:
      action: plans/aura_base/sleep
      params:
        seconds: 0.5
      depends_on: assert_group_text_clicked

    select_stage_and_enter:
      action: resonance_pc.try_select_action_summary_stage
      params:
        route_id: "{{ inputs.route_id }}"
        region: [450, 400, 750, 50]
        drag_forward: [1100, 400, 700, 400]
        drag_backward: [700, 400, 1100, 400]
        max_attempts: 12
        drag_duration_sec: 0.5
        drag_hold_before_release_sec: 0.5
        after_drag_sec: 0.5
        enter_button_text: "进入挑战"
        button_region_left_offset: -128
        button_region_top_offset: 143
        button_region_width: 258
        button_region_height: 95
        button_min_confidence: 0.8
        button_timeout_sec: 2.0
        button_click_attempts: 3
        after_button_click_sec: 0.5
        transition_text: "开始作战"
        transition_region: [790, 460, 430, 100]
        transition_timeout_sec: 4.0
        transition_min_confidence: 0.7
      depends_on: wait_after_group_click

    run_group_jobs:
      action: aura.run_task
      loop:
        for_each: "{{ inputs.jobs }}"
        parallelism: 1
      params:
        task_ref: "tasks:auto_battle_dispatch_pc.yaml:auto_battle_gp_action_summary_run_difficulty_pc"
        inputs:
          control_cid: "{{ inputs.control_cid | default(none) }}"
          route_id: "{{ loop.item.route_id }}"
          difficulty: "{{ loop.item.difficulty }}"
          formation_index: "{{ loop.item.formation_index | default(none) }}"
          capture_count: "{{ loop.item.capture_count | default(none) }}"
      depends_on: select_stage_and_enter
      when: "{{ nodes.select_stage_and_enter.output.success }}"

    click_back_to_action_summary:
      action: plans/aura_base/find_image_and_click
      params:
        region: [10, 5, 160, 70]
        template: "templates/battle/navigation/back_button.png"
        threshold: 0.9
        use_grayscale: true
        after_click_sec: 1.0
        timeout: 8.0
        interval: 0.2
        stable_scans: 2
        stable_center_tolerance_px: 2
        move_duration: 0.1
        required: true
      depends_on:
        all:
          - select_stage_and_enter: "success"
          - run_group_jobs: "success|failed|skipped"
      when: "{{ inputs.return_to_list }}"

    wait_after_back_to_action_summary:
      action: plans/aura_base/sleep
      params:
        seconds: 1.0
      depends_on: click_back_to_action_summary

    assert_stage_entry_succeeded:
      action: plans/aura_base/assert_condition
      params:
        condition: "{{ nodes.select_stage_and_enter.output.success }}"
        message: "{{ nodes.select_stage_and_enter.output.error_message | default('failed to enter action_summary stage') }}"
      depends_on:
        wait_after_back_to_action_summary: "success|skipped"

  returns:
    success: true
    route_id: "{{ inputs.route_id }}"
    gp_group_name: "{{ inputs.gp_group_name }}"
    gp_stage_name: "{{ inputs.gp_stage_name }}"
    job_count: "{{ inputs.jobs | length }}"
    outcome: "{{ nodes.run_group_jobs.output[0].outcome if (inputs.jobs | length) == 1 else 'batch' }}"
    battle_started: "{{ nodes.run_group_jobs.output[0].battle_started if (inputs.jobs | length) == 1 else none }}"
    page_after: "{{ 'unknown' if inputs.return_to_list else nodes.run_group_jobs.output[0].page_after }}"
    ready_for_next: "{{ false if inputs.return_to_list else nodes.run_group_jobs.output[0].ready_for_next }}"
    branch: "{{ nodes.run_group_jobs.output[0].branch if (inputs.jobs | length) == 1 else none }}"
    results: "{{ nodes.run_group_jobs.output }}"


auto_battle_gp_action_summary_batch_pc:
  meta:
    role: internal
    domain: 战斗
    title: Auto Battle PC GP ActionSummary Batch
    description: Execute grouped action_summary jobs.
    inputs:
      - name: jobs
        type: list
        required: true
        min_items: 1
  steps:
    group_stage_jobs:
      action: resonance_pc.group_consecutive_jobs_by_route
      params:
        jobs: "{{ inputs.jobs }}"

    run_stage_groups:
      action: aura.run_task
      loop:
        for_each: "{{ nodes.group_stage_jobs.output.groups }}"
        parallelism: 1
      params:
        task_ref: "tasks:auto_battle_dispatch_pc.yaml:auto_battle_gp_action_summary_run_group_pc"
        inputs:
          route_id: "{{ loop.item.route_id }}"
          gp_group_name: "{{ loop.item.gp_group_name }}"
          gp_stage_name: "{{ loop.item.gp_stage_name }}"
          jobs: "{{ loop.item.jobs }}"
      depends_on: group_stage_jobs

  returns:
    success: true
    category: "action_summary"
    group_count: "{{ nodes.group_stage_jobs.output.group_count }}"


