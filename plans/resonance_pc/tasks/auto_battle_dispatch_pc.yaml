    job_count: "{{ inputs.jobs | length }}"


auto_battle_ct_regional_ops_run_one_pc:
  meta:
    role: internal
    domain: 战斗
    title: Auto Battle PC CT RegionalOps Run One
    description: Execute one CT regional_ops_center job, preferring one sweep before actual combat.
    inputs:
      - name: route_id
        type: string
        required: true
      - name: city_name
        type: string
        required: true
      - name: threat_level
        type: number
        required: true
      - name: difficulty
        type: number
        required: true
      - name: formation_index
        type: number
        required: false
      - name: capture_count
        type: number
        required: false
      - name: control_cid
        type: string
        required: false
  steps:
    select_city:
      action: resonance_pc.select_ordered_city
      params:
        target_city_name: "{{ inputs.city_name }}"
        city_order:
          - "\u8352\u539f\u7ad9"
          - "\u94c1\u76df\u54e8\u7ad9"
          - "\u6dd8\u91d1\u4e50\u56ed"
          - "\u963f\u59ae\u5854\u80fd\u6e90\u7814\u7a76\u6240"
          - "\u963f\u59ae\u5854\u6218\u5907\u5de5\u5382"
          - "\u4e91\u5cab\u6865\u57fa\u5730"
          - "\u6816\u7fbd\u7ad9"
          - "\u6c47\u6d41\u5854"
          - "\u8fdc\u661f\u5927\u6865"
          - "\u7ef4\u8482\u6797\u573a"
        region: [45, 80, 255, 550]
        drag_up: [220, 560, 220, 260]
        drag_down: [220, 260, 220, 560]
        max_attempts: 15
        drag_duration_sec: 0.5
        drag_hold_before_release_sec: 0.5
        after_drag_sec: 0.5
        match_mode: "contains"

    wait_after_select_city:
      action: plans/aura_base/sleep
      params:
        seconds: 0.5
      depends_on: select_city

    select_threat_level:
      action: resonance_pc.select_threat_level_numeric
      params:
        threat_level: "{{ inputs.threat_level }}"
        region: [540, 200, 710, 70]
        drag_increase: [990, 240, 840, 240]
        drag_decrease: [840, 240, 990, 240]
        max_attempts: 20
        drag_duration_sec: 0.5
        drag_hold_before_release_sec: 0.5
        after_drag_sec: 0.5
      depends_on: wait_after_select_city

    click_change_difficulty:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "\u53d8\u66f4\u96be\u5ea6"
        region: [950, 420, 150, 50]
        match_mode: "contains"
      depends_on: select_threat_level

    wait_difficulty_menu:
      action: plans/aura_base/sleep
      params:
        seconds: 0.5
      depends_on: click_change_difficulty

    resolve_difficulty_text:
      action: resonance_pc.resolve_difficulty_text
      params:
        difficulty: "{{ inputs.difficulty }}"
      depends_on: wait_difficulty_menu

    click_difficulty_text:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "{{ nodes.resolve_difficulty_text.output.difficulty_text }}"
        region: [240, 480, 860, 60]
        match_mode: "contains"
      depends_on: resolve_difficulty_text

    click_confirm_difficulty:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "\u786e\u8ba4"
        region: [1100, 600, 100, 100]
        match_mode: "contains"
      depends_on: click_difficulty_text

    wait_go_combat_text:
      action: plans/aura_base/wait_for_text
      params:
        text_to_find: "\u524d\u5f80\u4f5c\u6218"
        timeout: 5.0
        interval: 0.5
        region: [1000, 560, 200, 60]
        match_mode: "contains"
      depends_on: click_confirm_difficulty

    try_sweep:
      action: resonance_pc.try_battle_sweep
      params:
        formation_index: "{{ inputs.formation_index | default(none) }}"
        control_cid: "{{ inputs.control_cid | default(none) }}"
        capture_count: "{{ inputs.capture_count | default(none) }}"
      depends_on: wait_go_combat_text

    click_go_combat:
      action: plans/aura_base/find_text_and_click
      params:
        text_to_find: "\u524d\u5f80\u4f5c\u6218"
        region: [1000, 560, 200, 60]
        match_mode: "contains"
      depends_on: try_sweep
      when: "{{ nodes.try_sweep.output.outcome == 'unsupported' }}"

    detect_stamina_after_go_combat:
      action: resonance_pc.detect_and_cancel_insufficient_stamina
      params:
        timeout_sec: 2.0
        interval_sec: 0.2
      depends_on:
        click_go_combat: "success|skipped"
      when: "{{ nodes.try_sweep.output.outcome == 'unsupported' }}"

    run_combat_after_go_combat:
      action: aura.run_task
      params:
        task_ref: "tasks:auto_battle_combat_pc.yaml:auto_battle_combat_pc"
        inputs:
          formation_index: "{{ inputs.formation_index | default(none) }}"
          capture_count: "{{ inputs.capture_count | default(none) }}"
      depends_on:
        detect_stamina_after_go_combat: "success|skipped"
      when: "{{ nodes.try_sweep.output.outcome == 'unsupported' and not nodes.detect_stamina_after_go_combat.output.insufficient_stamina }}"

  returns:
    success: true
    route_id: "{{ inputs.route_id }}"
    city_name: "{{ inputs.city_name }}"
    threat_level: "{{ inputs.threat_level }}"
    outcome: "{{ nodes.try_sweep.output.outcome if nodes.try_sweep.output.outcome != 'unsupported' else ('insufficient_stamina' if nodes.detect_stamina_after_go_combat.output.insufficient_stamina else nodes.run_combat_after_go_combat.output.outcome) }}"
    battle_started: "{{ nodes.try_sweep.output.battle_started if nodes.try_sweep.output.outcome != 'unsupported' else (false if nodes.detect_stamina_after_go_combat.output.insufficient_stamina else nodes.run_combat_after_go_combat.output.battle_started) }}"
    page_after: "{{ nodes.try_sweep.output.page_after if nodes.try_sweep.output.outcome != 'unsupported' else (nodes.detect_stamina_after_go_combat.output.page_after if nodes.detect_stamina_after_go_combat.output.insufficient_stamina else nodes.run_combat_after_go_combat.output.page_after) }}"
    ready_for_next: "{{ nodes.try_sweep.output.ready_for_next if nodes.try_sweep.output.outcome != 'unsupported' else (nodes.detect_stamina_after_go_combat.output.ready_for_next if nodes.detect_stamina_after_go_combat.output.insufficient_stamina else nodes.run_combat_after_go_combat.output.ready_for_next) }}"
    branch: "{{ nodes.try_sweep.output.branch if nodes.try_sweep.output.outcome != 'unsupported' else (nodes.detect_stamina_after_go_combat.output.branch if nodes.detect_stamina_after_go_combat.output.insufficient_stamina else nodes.run_combat_after_go_combat.output.branch) }}"


