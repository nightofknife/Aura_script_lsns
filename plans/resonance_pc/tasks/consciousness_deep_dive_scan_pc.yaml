consciousness_deep_dive_scan_pc:
  meta:
    title: 识海深潜魔方布局扫描（人工对比）
    description: 从普通魔方界面开始，默认通过实体模型与实时几何扫描六面，目标清单确认后结束并保留未知普通格；recognition_goal=full 可继续完整图案扫描。
    entry_point: true
    inputs:
      - {name: max_steps, type: number, default: 96, min: 1, max: 300}
      - {name: time_budget_sec, type: number, default: 300, min: 5, max: 900}
      - {name: drag_step_px, type: number, default: 300, min: 30, max: 450}
      - {name: drag_duration_sec, type: number, default: 0.15, min: 0.15, max: 1}
      - {name: settle_sec, type: number, default: 0.2, min: 0.2, max: 2}
      - {name: recognition_goal, type: string, default: targets}
      - {name: scan_route, type: enum, default: cells, enum: [cells, faces, mixed, vertices, target_cells, target_faces, target_framed, four_views]}
      - {name: startup_fast, type: boolean, default: false}
  steps:
    scan:
      action: resonance_pc.scan_consciousness_deep_dive_layout
      timeout: -1
      params:
        max_steps: "{{ inputs.max_steps }}"
        time_budget_sec: "{{ inputs.time_budget_sec }}"
        drag_step_px: "{{ inputs.drag_step_px }}"
        drag_duration_sec: "{{ inputs.drag_duration_sec }}"
        settle_sec: "{{ inputs.settle_sec }}"
        recognition_goal: "{{ inputs.recognition_goal }}"
        scan_route: "{{ inputs.scan_route }}"
        startup_fast: "{{ inputs.startup_fast }}"
  returns:
    deep_dive_scan: "{{ nodes.scan.output }}"
