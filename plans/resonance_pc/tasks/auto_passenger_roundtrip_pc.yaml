auto_passenger_roundtrip_pc:
  meta:
    title: Cape-Lanxin Passenger Round Trip (PC)
    description: Run fixed flyer-based passenger round trips between Cape City and Lanxin City.
    entry_point: true
    inputs:
      - name: round_trips
        type: number
        required: false
        default: 1
        min: 1
      - name: reposition_to_route
        type: boolean
        required: false
        default: true
      - name: preferred_start_city_id
        type: string
        required: false
        default: "11"
        enum: ["11", "15"]
      - name: use_fatigue_medicine
        type: boolean
        required: false
        default: false
      - name: allowed_fatigue_medicines
        type: list
        required: false
        default: []
      - name: fatigue_medicine_max_uses
        type: number
        required: false
        default: 4
        min: 0
      - name: arrival_timeout_seconds
        type: number
        required: false
        default: 1800
        min: 1
  steps:
    run:
      action: resonance_pc.auto_passenger_roundtrip_flow
      params:
        round_trips: "{{ inputs.round_trips | default(1) }}"
        reposition_to_route: "{{ inputs.reposition_to_route | default(true) }}"
        preferred_start_city_id: "{{ inputs.preferred_start_city_id | default('11') }}"
        use_fatigue_medicine: "{{ inputs.use_fatigue_medicine | default(false) }}"
        allowed_fatigue_medicines: "{{ inputs.allowed_fatigue_medicines | default([]) }}"
        fatigue_medicine_max_uses: "{{ inputs.fatigue_medicine_max_uses | default(4) }}"
        arrival_timeout_seconds: "{{ inputs.arrival_timeout_seconds | default(1800) }}"
  returns:
    success: "{{ nodes.run.output.success }}"
    status: "{{ nodes.run.output.status }}"
    reason: "{{ nodes.run.output.reason }}"
    start_city: "{{ nodes.run.output.start_city }}"
    end_city: "{{ nodes.run.output.end_city }}"
    requested_round_trips: "{{ nodes.run.output.requested_round_trips }}"
    completed_round_trips: "{{ nodes.run.output.completed_round_trips }}"
    completed_legs: "{{ nodes.run.output.completed_legs }}"
    reposition_leg: "{{ nodes.run.output.reposition_leg }}"
    expected_fatigue_used: "{{ nodes.run.output.expected_fatigue_used }}"
    recruited_passengers: "{{ nodes.run.output.recruited_passengers }}"
    flyers_used: "{{ nodes.run.output.flyers_used }}"
    ticket_revenue: "{{ nodes.run.output.ticket_revenue }}"
    extra_revenue: "{{ nodes.run.output.extra_revenue }}"
    total_revenue: "{{ nodes.run.output.total_revenue }}"
    fatigue_medicine_used: "{{ nodes.run.output.fatigue_medicine_used }}"
    failure_stage: "{{ nodes.run.output.failure_stage }}"
    requires_manual_completion: "{{ nodes.run.output.requires_manual_completion }}"
    loaded_destination: "{{ nodes.run.output.loaded_destination }}"
    page_state: "{{ nodes.run.output.page_state }}"
