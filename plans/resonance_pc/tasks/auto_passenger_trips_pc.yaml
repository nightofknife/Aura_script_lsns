auto_passenger_trips_pc:
  meta:
    title: Passenger Trips (PC)
    description: Run a configured number of alternating one-way passenger trips between two cities.
    entry_point: true
    inputs:
      - name: passenger_city_a_id
        type: string
        required: false
        default: "11"
      - name: passenger_city_b_id
        type: string
        required: false
        default: "15"
      - name: trip_count
        type: number
        required: false
        default: 1
        min: 1
      - name: trade_during_trip
        type: boolean
        required: false
        default: true
      - name: reposition_to_route
        type: boolean
        required: false
        default: true
      - name: use_fatigue_medicine
        type: boolean
        required: false
        default: false
      - name: allowed_fatigue_medicines
        type: list
        required: false
        default: []
      - name: fatigue_medicine_max_uses
        type: number
        required: false
        default: 4
        min: 0
      - name: arrival_timeout_seconds
        type: number
        required: false
        default: 1800
        min: 1
  steps:
    run:
      action: resonance_pc.auto_passenger_trips_flow
      params:
        passenger_city_a_id: "{{ inputs.passenger_city_a_id | default('11') }}"
        passenger_city_b_id: "{{ inputs.passenger_city_b_id | default('15') }}"
        trip_count: "{{ inputs.trip_count | default(1) }}"
        trade_during_trip: "{{ inputs.trade_during_trip | default(true) }}"
        reposition_to_route: "{{ inputs.reposition_to_route | default(true) }}"
        use_fatigue_medicine: "{{ inputs.use_fatigue_medicine | default(false) }}"
        allowed_fatigue_medicines: "{{ inputs.allowed_fatigue_medicines | default([]) }}"
        fatigue_medicine_max_uses: "{{ inputs.fatigue_medicine_max_uses | default(4) }}"
        arrival_timeout_seconds: "{{ inputs.arrival_timeout_seconds | default(1800) }}"
  returns:
    success: "{{ nodes.run.output.success }}"
    status: "{{ nodes.run.output.status }}"
    reason: "{{ nodes.run.output.reason }}"
    start_city: "{{ nodes.run.output.start_city }}"
    end_city: "{{ nodes.run.output.end_city }}"
    passenger_route: "{{ nodes.run.output.passenger_route }}"
    trip_fatigue: "{{ nodes.run.output.trip_fatigue }}"
    route_fatigue: "{{ nodes.run.output.route_fatigue }}"
    reposition_fatigue: "{{ nodes.run.output.reposition_fatigue }}"
    requested_trips: "{{ nodes.run.output.requested_trips }}"
    completed_trips: "{{ nodes.run.output.completed_trips }}"
    completed_legs: "{{ nodes.run.output.completed_legs }}"
    reposition_leg: "{{ nodes.run.output.reposition_leg }}"
    expected_fatigue_used: "{{ nodes.run.output.expected_fatigue_used }}"
    recruited_passengers: "{{ nodes.run.output.recruited_passengers }}"
    flyers_used: "{{ nodes.run.output.flyers_used }}"
    ticket_revenue: "{{ nodes.run.output.ticket_revenue }}"
    extra_revenue: "{{ nodes.run.output.extra_revenue }}"
    total_revenue: "{{ nodes.run.output.total_revenue }}"
    trade_during_trip: "{{ nodes.run.output.trade_during_trip }}"
    trade_legs: "{{ nodes.run.output.trade_legs }}"
    trade_expected_profit: "{{ nodes.run.output.trade_expected_profit }}"
    trade_final_sale: "{{ nodes.run.output.trade_final_sale }}"
    trade_warnings: "{{ nodes.run.output.trade_warnings }}"
    fatigue_medicine_used: "{{ nodes.run.output.fatigue_medicine_used }}"
    failure_stage: "{{ nodes.run.output.failure_stage }}"
    requires_manual_completion: "{{ nodes.run.output.requires_manual_completion }}"
    loaded_destination: "{{ nodes.run.output.loaded_destination }}"
    page_state: "{{ nodes.run.output.page_state }}"
