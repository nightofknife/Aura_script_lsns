maintain_raw_material_workshop_pc:
  meta:
    title: 原料车间维护（PC）
    description: 从普通总览进入指定原料车间，预存最多、有限循环补工作和替补、必要时开始生产并复查替补，最终状态确认后返回普通总览；不终止、不加速、不改配方、不领取、不建设。
    entry_point: true
    concurrency: exclusive
    inputs:
      - name: room_name
        type: enum
        enum: [植物纤维原料车间, 动物纤维原料车间, 缝纫工具原料车间, 人造纤维原料车间]
        required: true
      - name: max_work_rounds
        type: enum
        enum: [1, 2, 3, 4, 5, 6, 7, 8]
        default: 8
      - name: max_reserve_rounds
        type: enum
        enum: [1, 2, 3, 4, 5, 6, 7, 8]
        default: 8
      - {name: max_search_steps, type: number, default: 12, min: 1, max: 24}
      - {name: settle_sec, type: number, default: 0.8, min: 0.05, max: 10}
  steps:
    navigate:
      action: aura.run_task
      params:
        task_ref: tasks:open_reforming_center_room_pc.yaml:open_reforming_center_room_pc
        inputs:
          room_name: "{{ inputs.room_name }}"
          max_search_steps: "{{ inputs.max_search_steps }}"
          settle_sec: "{{ inputs.settle_sec }}"
    observe:
      action: resonance_pc.raw_workshop_observe
      depends_on: navigate
      # aura.run_task returns framework_data, not the child's user_data.
      when: "{{ nodes.navigate.output.nodes.open_room.output.success and nodes.navigate.output.nodes.open_room.output.room_entered }}"
      params: {room_name: "{{ inputs.room_name }}"}
    deposit:
      action: resonance_pc.raw_workshop_deposit_max
      depends_on: {observe: "success|skipped"}
      when: "{{ nodes.observe.output is not none and nodes.observe.output.safe_to_continue and nodes.observe.output.snapshot.production == 'idle' }}"
      params: {room_name: "{{ inputs.room_name }}"}
    work:
      action: resonance_pc.raw_workshop_fill_list_until_full
      depends_on: {deposit: "success|skipped"}
      when: "{{ nodes.observe.output is not none and nodes.observe.output.safe_to_continue and nodes.observe.output.snapshot.production == 'idle' and nodes.deposit.output is not none and nodes.deposit.output.safe_to_continue }}"
      params:
        room_name: "{{ inputs.room_name }}"
        list_kind: work
        max_rounds: "{{ inputs.max_work_rounds | int }}"
    reserve:
      action: resonance_pc.raw_workshop_fill_list_until_full
      depends_on: {work: "success|skipped"}
      when: "{{ nodes.observe.output is not none and nodes.observe.output.safe_to_continue and (nodes.work.output is none or (nodes.work.output.safe_to_continue and not (nodes.work.output.stop_staff_fill | default(false)))) and (nodes.deposit.output is none or nodes.deposit.output.safe_to_continue) }}"
      params:
        room_name: "{{ inputs.room_name }}"
        list_kind: reserve
        max_rounds: "{{ inputs.max_reserve_rounds | int }}"
    before_start:
      action: resonance_pc.raw_workshop_observe
      depends_on: {reserve: "success|skipped"}
      when: "{{ nodes.observe.output is not none and nodes.observe.output.safe_to_continue and (nodes.deposit.output is none or nodes.deposit.output.safe_to_continue) and (nodes.work.output is none or nodes.work.output.safe_to_continue) and (nodes.reserve.output is none or nodes.reserve.output.safe_to_continue) }}"
      params: {room_name: "{{ inputs.room_name }}"}
    start:
      action: resonance_pc.raw_workshop_start_once
      depends_on: {before_start: "success|skipped"}
      when: "{{ nodes.before_start.output is not none and nodes.before_start.output.safe_to_continue and nodes.before_start.output.snapshot.production == 'idle' and (nodes.work.output is none or not (nodes.work.output.stop_staff_fill | default(false))) and (nodes.reserve.output is none or not (nodes.reserve.output.stop_staff_fill | default(false))) }}"
      params: {room_name: "{{ inputs.room_name }}"}
    reserve_after_start:
      action: resonance_pc.raw_workshop_fill_list_until_full
      depends_on: {start: "success|skipped"}
      when: "{{ nodes.start.output is not none and nodes.start.output.safe_to_continue and nodes.start.output.snapshot.production == 'running' and nodes.reserve.output is not none and nodes.reserve.output.safe_to_continue and not (nodes.reserve.output.stop_staff_fill | default(false)) }}"
      params:
        room_name: "{{ inputs.room_name }}"
        list_kind: reserve
        max_rounds: "{{ inputs.max_reserve_rounds | int }}"
        previous_result: "{{ nodes.reserve.output }}"
    final_observe:
      action: resonance_pc.raw_workshop_observe
      depends_on: {reserve_after_start: "success|skipped"}
      when: "{{ nodes.before_start.output is not none and nodes.before_start.output.safe_to_continue and (nodes.start.output is none or nodes.start.output.safe_to_continue) and (nodes.reserve_after_start.output is none or nodes.reserve_after_start.output.safe_to_continue) }}"
      params: {room_name: "{{ inputs.room_name }}"}
    return_overview:
      action: resonance_pc.raw_workshop_return_overview
      depends_on: {final_observe: "success|skipped"}
      when: "{{ nodes.final_observe.output is not none and nodes.final_observe.output.safe_to_continue }}"
      params: {room_name: "{{ inputs.room_name }}"}
    finish:
      action: resonance_pc.raw_workshop_summarize
      depends_on: {return_overview: "success|skipped"}
      params:
        room_name: "{{ inputs.room_name }}"
        navigation: "{{ nodes.navigate.output.nodes.open_room.output | default(none) }}"
        observation: "{{ nodes.observe.output }}"
        before_start: "{{ nodes.before_start.output }}"
        final_observe: "{{ nodes.final_observe.output }}"
        return_overview: "{{ nodes.return_overview.output }}"
        require_return: true
        deposit: "{{ nodes.deposit.output }}"
        work: "{{ nodes.work.output }}"
        reserve_rounds: ["{{ nodes.reserve.output }}"]
        reserve_after_start: "{{ nodes.reserve_after_start.output }}"
        start: "{{ nodes.start.output }}"
        max_reserve_rounds: "{{ inputs.max_reserve_rounds | int }}"
  returns:
    success: "{{ nodes.finish.output.success }}"
    status: "{{ nodes.finish.output.status }}"
    reason: "{{ nodes.finish.output.reason }}"
    room_name: "{{ nodes.finish.output.room_name }}"
    snapshot: "{{ nodes.finish.output.snapshot }}"
    returned_to_overview: "{{ nodes.finish.output.returned_to_overview }}"
    page_after: "{{ nodes.finish.output.page_after }}"
    data: "{{ nodes.finish.output.data }}"
